<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地底レバー</title>
<meta name="description" content="拉動拉桿彈出金貨，沿軌道一路深入地底的單檔休閒遊戲">
<style>
  :root{
    --bg:#0b0a0c; --fg:#f1e6d2; --sub:#a8998a;
    --howto-bg:#231c18; --howto-fg:#f1e6d2;
    --rock0:#6a5641; --rock1:#463a31; --rock2:#2b2630; --rock3:#14131c; --rock4:#08080d;
    --wall:#231c18; --wall-edge:#5c4a3b;
    --plank:#8a5a33; --plank-dark:#3e2614; --nail:#24170d;
    --lever:#e2e6e9; --lever-line:#3b3f44;
    --hole:#030203; --hole-rim:#3a2c20;
    --coin:#e3b23c; --coin-line:#8f6514; --coin-hi:#fff0b3;
    --crystal:#78b4ff; --crystal2:#c18cff;
    --sky:#6fb2ea; --sky-low:#cfe9fb;
    --hill:#93c96f; --grass:#5da540; --grass-dark:#3d7d2a; --soil:#7a5a3c;
    --accent-danger:#c0563f;   /* 新增：危險／被追逼近色 */
    --accent-exit:#e8c97a;     /* 新增：出口門光色 */
    --accent-crystal:#78b4ff;  /* 新增：晶眼 Boss 與結晶事件色 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"PingFang TC","Hiragino Sans TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  #game{position:relative;width:100%;max-width:420px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ---- 頂部單列 HUD：高 44px，左右內縮 10px，中間留空 ---- */
  #hud{position:absolute;top:0;left:0;right:0;height:44px;z-index:5;display:flex;align-items:center;flex-wrap:nowrap;
    padding:calc(10px + env(safe-area-inset-top)) 10px 0 10px;gap:10px;pointer-events:none}
  #capsule{display:flex;align-items:baseline;gap:4px;padding:6px 10px;border-radius:10px;min-width:0;
    background:rgba(20,16,14,.62);border:1px solid rgba(241,230,210,.22);pointer-events:auto;white-space:nowrap}
  #coinCapsule{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;min-width:0;
    background:rgba(20,16,14,.62);border:1px solid rgba(227,178,60,.35);pointer-events:auto;white-space:nowrap}
  #coinIcon{width:8px;height:8px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 30% 30%, #fff0b3 0%, #e3b23c 45%, #8f6514 100%);
    border:1px solid rgba(143,101,20,.8)}
  #coinVal{font-size:12px;font-weight:700;color:var(--coin);letter-spacing:.5px;display:inline-block}
  #coinCapsule.jump #coinVal{animation:coinJump .35s ease}
  @keyframes coinJump{0%{transform:translateY(0)}40%{transform:translateY(-2px)}100%{transform:translateY(0)}}
  #floorMain{font-size:13px;font-weight:700;letter-spacing:.5px}
  #floorSub{font-size:11px;color:var(--sub)}
  #gemDots{display:flex;gap:3px;margin-left:4px}
  #gemDots i{width:2px;height:2px;border-radius:50%;background:transparent;display:inline-block}
  #gemDots i.on{background:var(--coin)}
  #modBar{width:2px;align-self:stretch;border-radius:1px;flex:none}
  #itemBar{position:absolute;top:54px;left:12px;display:flex;gap:6px;z-index:6}
  .itemChip{position:relative;width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .itemChip::before{content:'';position:absolute;left:9px;top:9px;width:26px;height:26px;border-radius:7px;border:1px solid rgba(241,230,210,.25);background:rgba(20,16,12,.72)}
  .itemChip .ic{position:relative;z-index:1;font-size:11px}
  .itemChip .n{position:relative;z-index:1;font-size:9px;color:var(--coin);margin-top:1px}
  #bossBar{flex:1;max-width:180px;display:none;flex-direction:column;gap:2px;justify-content:center}
  #bossBar.on{display:flex}
  #armorDots{display:flex;gap:3px;height:2px}
  #armorDots i{width:2px;height:2px;border-radius:50%;background:var(--coin);opacity:.9}
  #armorDots i.off{background:rgba(241,230,210,.25)}
  #bossBarTrack{position:relative;height:4px;border-radius:2px;background:rgba(241,230,210,.18);overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,240,205,.12)}
  #bossBarFill{height:100%;width:0%;border-radius:2px;background:var(--coin)}
  #bossBarFill.hot{background:var(--accent-danger)}
  #bossBar.eye #bossBarFill{background:linear-gradient(90deg,var(--crystal),var(--accent-crystal))}
  #bossBarTrack::after{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(0,0,0,.5) calc(10% - 1px) 10%)}
  #hudRight{margin-left:auto;display:flex;gap:8px;pointer-events:auto}
  #hud button{min-height:44px;padding:0 12px;font-size:14px;font-family:inherit;border:1px solid rgba(241,230,210,.35);
    border-radius:8px;background:rgba(20,16,14,.62);color:var(--fg)}
  #autoBtn.on{background:var(--coin);color:#1a1410;border-color:var(--coin)}

  /* 成就提示：右上單行，同時最多一條 */
  #toast{position:absolute;top:calc(54px + env(safe-area-inset-top));right:10px;z-index:6;max-width:70%;
    padding:8px 12px;border-radius:8px;background:rgba(20,16,14,.86);border:1px solid rgba(241,230,210,.25);
    font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:right}
  #toast.on{opacity:1}

  /* ---- 結算頁 ---- */
  #over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(5,4,6,.78);color:var(--fg);text-align:center;padding:20px}
  #over .big{font-size:42px;font-weight:700}
  #over .sub{font-size:14px;color:var(--sub)}
  .overBtns{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  #over button{min-width:180px;min-height:48px;font-size:18px;font-family:inherit;border:0;border-radius:8px;background:var(--fg);color:#1a1410}
  #over button.ghost{background:transparent;color:var(--fg);border:1px solid rgba(241,230,210,.35)}

  /* ---- 覆蓋層（圖鑑／統計／成就／說明） ---- */
  #overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:rgba(5,4,6,.72);padding:16px}
  #panel{width:100%;max-width:340px;max-height:90%;display:flex;flex-direction:column;border-radius:14px;
    background:var(--howto-bg);border:1px solid rgba(241,230,210,.18);overflow:hidden}
  #panelHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
  #panelTitle{font-size:17px;font-weight:700}
  #panelClose{width:44px;height:44px;border-radius:10px;border:1px solid rgba(241,230,210,.3);background:transparent;color:var(--fg);font-size:16px;display:flex;align-items:center;justify-content:center}
  #panelBody{padding:4px 16px 16px;overflow-y:auto;font-size:14px;line-height:1.6}
  .panelRow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(241,230,210,.08)}
  .panelRow:last-child{border-bottom:0}
  .panelRow .k{color:var(--sub)}
  .menuList{display:flex;flex-direction:column;gap:4px}
  .menuList.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .menuList.grid2 .gridFull{grid-column:1/-1}
  .menuList button{min-height:44px;border-radius:10px;border:1px solid rgba(241,230,210,.25);background:rgba(255,255,255,.05);color:var(--fg);font-size:15px;font-family:inherit;text-align:left;padding:0 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
  .menuList button.sm{min-height:44px;font-size:14px;border-radius:9px}
  .menuList button .k{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menuList button .v{flex:none;white-space:nowrap;color:var(--sub);font-size:13px}
  .menuSec{font-size:12px;color:var(--sub);letter-spacing:1px;margin:4px 2px 2px}
  .menuSec:first-child{margin-top:0}
  .menuList button{transition:transform .08s, background .15s}
  .menuList button:hover:not(:disabled){background:rgba(255,255,255,.1)}
  .menuList button:active:not(:disabled){transform:scale(.98)}
  .menuList button:disabled{opacity:.65;cursor:default}
  .menuList button.lockedRow{opacity:.45;cursor:default}
  #hud button:hover:not(:disabled), .shopRow button:hover:not(:disabled){background:rgba(255,255,255,.1)}
  #hud button:active:not(:disabled), .shopRow button:active:not(:disabled){transform:scale(.98)}
  .shopRow button:disabled{opacity:.65;cursor:default}
  .codexGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .codexItem{border:1px solid rgba(241,230,210,.12);border-radius:10px;padding:10px}
  .codexItem .n{font-weight:700;font-size:14px}
  .codexItem .d{font-size:12px;color:var(--sub);margin-top:2px}
  .codexItem.unknown .n{color:var(--sub)}
  .achRow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(241,230,210,.08)}
  .achRow:last-child{border-bottom:0}
  .achDot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--sub)}
  .achDot.on{background:var(--coin)}
  .achRow .t{font-weight:700}
  .achRow .d{font-size:12px;color:var(--sub)}
  .shopCoins{padding:2px 0 10px;font-size:14px;color:var(--coin);font-weight:700}
  .shopRow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(241,230,210,.08)}
  .shopRow:last-child{border-bottom:0}
  .shopMain{min-width:0}
  .shopName{font-weight:700;font-size:14px}
  .shopName .v{color:var(--sub);font-weight:400;font-size:12px}
  .shopDesc{font-size:12px;color:var(--sub);margin-top:2px}
  .shopRow button{min-height:44px;padding:0 12px;border-radius:8px;border:1px solid rgba(241,230,210,.25);background:rgba(255,255,255,.05);color:var(--fg);font-family:inherit;font-size:13px;flex:none}
  .shopRow button:disabled{opacity:.45}
  .shopRow button:not(:disabled){background:var(--coin);color:#1a1410;border-color:var(--coin)}

  /* ---- 首次教學覆蓋層 ---- */
  #tutorial{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:rgba(5,4,6,.7);padding:24px;text-align:center}
  #tutorial .steps{display:flex;flex-direction:column;gap:14px}
  #tutorial .step{display:flex;gap:12px;align-items:center;text-align:left}
  #tutorial .step .num{width:28px;height:28px;border-radius:50%;border:1px solid var(--coin);color:var(--coin);
    display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
  #tutorial .step .txt{font-size:14px;line-height:1.5}
  #tutorial .hint{font-size:12px;color:var(--sub)}

  .hidden{display:none !important}
  :focus-visible{outline:1.5px solid rgba(227,178,60,.55);outline-offset:2px}
  #panelClose:focus-visible{outline:1px solid rgba(227,178,60,.3);outline-offset:1px}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div id="capsule">
      <span id="modBar" class="hidden"></span>
      <span id="floorMain">B1</span>
      <span id="floorSub"></span>
      <span id="gemDots"></span>
    </div>
    <div id="coinCapsule"><span id="coinIcon"></span><span id="coinVal">0</span></div>
    <div id="bossBar"><div id="armorDots"></div><div id="bossBarTrack"><div id="bossBarFill"></div></div></div>
    <div id="hudRight">
      <button id="menuBtn" type="button">選單</button>
      <button id="autoBtn" type="button">自動: OFF</button>
    </div>
  </div>
  <div id="itemBar" class="hidden"></div>

  <div id="toast"></div>

  <div id="over" class="hidden">
    <div class="big" id="result"></div>
    <div class="sub" id="best"></div>
    <div class="sub" id="statLine"></div>
    <div class="overBtns">
      <button id="retry" type="button">再來一次</button>
      <button id="share" type="button">分享</button>
      <button id="menuOpen" type="button" class="ghost">選單</button>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div id="panelHead"><div id="panelTitle">選單</div><button id="panelClose" type="button" aria-label="關閉面板">×</button></div>
      <div id="panelBody"></div>
    </div>
  </div>

  <div id="tutorial" class="hidden">
    <div class="steps">
      <div class="step"><div class="num">1</div><div class="txt">按住畫面任意處拉動拉桿，力道隨時間累積。</div></div>
      <div class="step"><div class="num">2</div><div class="txt">放開彈出金貨，越過切縫落到下一段即推進一層。</div></div>
      <div class="step"><div class="num">3</div><div class="txt">避開洞穴與岩塊，深入地底；每隔五層有寶藏，每十層有 Boss 競技場。</div></div>
    </div>
    <div class="hint">點擊任意處開始</div>
    <div class="hint" id="tutVer"></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  // ================= 常數區（所有可調數值集中於此） =================
  const VERSION = '4.1';                  // 版本號，顯示於說明／結算／結果圖
  const VERSION_TAG = 'v4.1 遺跡工坊';    // 副標

  // ---- 既有物理常數（語意不得更動） ----
  const BOARD_W = 320;        // 盤面內側寬度（盤面單位，隨畫面縮放）
  const WALL = 8;             // 左右牆厚
  const LEVER_AREA = 36;      // 牆外拉桿繪製寬度
  const COIN_R = 12;          // 金貨半徑
  const G = 1500;             // 重力（單位/秒²）
  const V_MAX = 750;          // 拉滿時的初速（單位/秒）
  const CHARGE_TIME = 1.0;    // 拉滿所需時間（秒）
  const ROLL_DECEL = 40;      // 軌道滾動減速（單位/秒²）
  const RAIL_BOUNCE = 0.6;    // 落軌反彈係數
  const BOUNCE_MIN_V = 35;    // 低於此速度落軌不反彈
  const WALL_BOUNCE = 0.2;    // 牆面反彈係數
  const SIMPLE_LEVELS = 2;    // 最初幾段僅直線坡道
  const TRAP_DEPTH = 20;      // 落穴判定深度
  const PIT_W_MIN = 26;       // 落穴寬度範圍
  const PIT_W_MAX = 28;
  const PIT_SLOPE_MIN = 10;   // 落穴段坡道傾角（度）
  const PIT_SLOPE_MAX = 15;
  const PIT_AFTER = 50;       // 落穴至切縫最小距離
  const VALLEY_W_MIN = 14;    // 窪地半寬
  const VALLEY_W_MAX = 20;
  const VALLEY_DEPTH_MIN = 4; // 窪地深度
  const VALLEY_DEPTH_MAX = 8;
  const VALLEY_HOLE_R = 17;   // 窪地底穴半徑
  const ROCK_RATE = 0.6;      // 彈台末端吊岩機率
  const ROCK_R_MIN = 9;       // 岩塊半徑
  const ROCK_R_MAX = 14;
  const ROCK_UP_MIN = 30;     // 岩塊下端距彈台高度
  const ROCK_UP_MAX = 55;
  const ROCK_BOUNCE = 0.55;   // 岩塊反彈係數
  const ROCK_STEM = 26;       // 吊岩根部長度（視覺）
  const TWOSTEP_STEEP_MIN = 10; // 雙段坡道陡坡傾角（度）
  const TWOSTEP_STEEP_MAX = 18;
  const KICK_LEN_MIN = 22;    // 彈台長度
  const KICK_LEN_MAX = 40;
  const KICK_SLOPE_MIN = 12; // 彈台傾角（度）
  const KICK_SLOPE_MAX = 22;
  const FAR_DOWN_MIN = 4;     // 遠側下坡傾角（度）
  const FAR_DOWN_MAX = 10;
  const FAR_DOWN_MIN_H = 4;
  const SLOPE_MIN = 3.5;      // 軌道最小傾角（度）
  const SLOPE_MAX = 15;       // 軌道最大傾角（度）
  const CLEAR_MIN = 50;       // 上下軌道淨距最小
  const CLEAR_MAX = 100;      // 同上最大
  const GAP_POS_MIN = 0.6;    // 切縫位置範圍（距拉桿牆比例）
  const GAP_POS_MAX = 0.8;
  const FAR_MIN_LEN = 64;     // 機關段切縫遠側軌道最小長度
  const GAP_MARGIN = 100;     // 落點與本段切縫間距
  const LAND_PAD = 45;        // 落點範圍外不開穴寬度
  const LAND_PAD_FEATURE = 10; // 窪地／落穴同項寬度
  const LAND_MARGIN = 35;     // 落點與途中穴間距
  const MID_HOLES_MAX = 2;    // 途中穴數上限
  const MID_HOLE_GAP = 40;    // 穴間最小間距
  const GAP_W_MIN = 26;       // 切縫寬度最小
  const GAP_W_MAX = 32;       // 切縫寬度最大
  const HOLE_R_MIN = 14;      // 穴半徑最小
  const HOLE_R_MAX = 16;      // 穴半徑最大
  const HOLE_FIT = 3;         // 金貨未超出穴多少即落入
  const WALL_HOLE_REACH = 30; // 牆邊穴承接高度
  const HOLE_PASS_V = 150;    // 低於此橫速穿越穴上方會落入
  const REST_V = 20;          // 低於此速度視為靜止
  const LEVER_REACH = 8;      // 距拉桿此範圍內可彈射／抵達
  const REST_DIST = 3;        // 靜止點判定距離
  const FAIL_BACK = 6;        // 重做此次數後回上一段重做
  const FAIL_GIVEUP = 12;      // 仍失敗則照用
  const FAIL_SIMPLE = 4;       // 此次數後改無機關段
  const STUCK_V = 1;          // 低於此速度持續視為卡死
  const STUCK_TIME = 1.0;     // 卡死判定時長（秒）
  const REST_TIME = 0.12;     // 靜止判定時長（秒）
  const AUTO_STALL_S = 4.0;   // R3：自動無解段靜止逾此秒數安全重開
  const SIM_TIME = 6;         // 配置驗證最長模擬（秒）
  const STRONG_FROM = 88;     // 高於此力道必敗的配置判定
  const WIN_STEP = 4;         // 配置掃描力道刻（%）
  const LEVER_KNOB_R = 9;     // 拉桿握把半徑
  const TRAIL_V = 300;        // 高於此速度留下殘影
  const TRAIL_TIME = 0.12;    // 殘影存留（秒）
  const TRAIL_ALPHA = 0.55;   // 殘影最深透明度
  const FOG_START = 10;        // 最下段下端起霧距離
  const FOG_H = 120;          // 岩色漸層高度
  const FOG_SCREEN = 0.3;     // 畫面底部常駐岩色比例
  const VARIETY_TRIES = 10;   // 多樣性嘗試次數
  const VARIETY_PENALTY = 10; // 重複／無機關扣分
  const GEN_TRIES = 40;       // 一段配置嘗試總數
  const SHIFT_MIN = 8;        // 與上段成功力道錯開幅度（%）
  const LEVELS_START = 3;     // 開場預生成段數
  const GEN_FRAME_MS = 3;     // R1：每幀生成／驗證時間片上限（毫秒，僅排程用，不影響段內容）
  const GEN_TRIALS_PER_FRAME = 60; // R1：單幀 trial 計數後備上限（主上限為時間片）
  const LEVELS_AHEAD = 8;     // 預先生成段數
  const WIN_MIN0 = 10;        // 成功力道寬度下限（首段）
  const WIN_MIN_END = 6;      // 同上（深段）
  const WIN_MAX0 = 34;        // 成功力道寬度上限（首段）
  const WIN_MAX_END = 20;     // 同上（深段）
  const WIN_LEVELS = 25;      // 難化跨度段數
  const COIN_SCREEN_Y = 0.40; // 金貨於畫面高度比例
  const CAM_EASE = 9;         // 相機追隨速度（1/秒）
  const FALL_TIME = 0.5;      // 落穴至結算時長（秒）
  const STEP = 1 / 480;        // 物理固定步進（秒）

    if (feature === 'valley') farType = 'down';
    if (event === 'treasure'){ feature = 'none'; slopeType = 'straight'; farType = 'up'; }
    if (arena){ slopeType = 'straight'; if (feature !== 'kicker') feature = 'none'; farType = 'up'; }
    const lo = feature === 'none' ? Math.min(GAP_POS_MAX * BOARD_W, lo0) : Math.max(lo0, featFrom + span(feature) + GAP_W_MAX / 2);
    const gapPos = rand(lo, Math.max(lo, feature === 'none' ? GAP_POS_MAX * BOARD_W : hiF));
    const gw = rand(GAP_W_MIN, GAP_W_MAX);
    const g0 = gapPos - gw / 2, g1 = gapPos + gw / 2;

    const tan = deg => Math.tan(deg * Math.PI / 180);
    if (feature === 'pitfall') slopeType = 'straight';
    const s1 = tan(feature === 'pitfall' ? rand(PIT_SLOPE_MIN, PIT_SLOPE_MAX) : event === 'treasure' ? rand(SLOPE_MIN, 8) : rand(SLOPE_MIN, SLOPE_MAX));
    let base = [[0, 0], [BOARD_W, BOARD_W * s1]];
    if (slopeType === 'twostep'){
      const d1 = rand(0.35, 0.65) * g0;
      const steep = () => tan(rand(TWOSTEP_STEEP_MIN, TWOSTEP_STEEP_MAX)), gentle = () => tan(rand(SLOPE_MIN, SLOPE_MIN + 2));
      const [a1, a2] = rngFn() < 0.5 ? [gentle(), steep()] : [steep(), gentle()];
      base = [[0, 0], [d1, d1 * a1], [BOARD_W, d1 * a1 + (BOARD_W - d1) * a2]];
    }

    // 機關
    let near = polyCut(base, 0, g0);
    let kickFrom = g0, rock = null, trap = null, spring = null;
    const blocked = [];
    if (feature === 'kicker'){
      const len = kickLen;
      if (g0 - len > featFrom + 10){
        kickFrom = g0 - len;
        const hk = polyH(base, kickFrom);
        near = [...polyCut(base, 0, kickFrom), [g0, hk + len * tan(rand(KICK_SLOPE_MIN, KICK_SLOPE_MAX))]];
        blocked.push([kickFrom - 10, g0]);
        if (rngFn() < ROCK_RATE){
          const d = g0 + rand(-10, 30), r = rand(ROCK_R_MIN, ROCK_R_MAX);
          rock = { d, r, h: polyH(near, g0) + rand(ROCK_UP_MIN, ROCK_UP_MAX) + r };
        }
      } else feature = 'none';
    } else if (feature === 'valley'){
      const dvMin = featFrom + vw + 10, dvMax = g0 - vw - 25;
      if (dvMax > dvMin){
        const dv = rand(dvMin, dvMax);
        const hl = polyH(base, dv - vw), hm = polyH(base, dv), hr = polyH(base, dv + vw);
        const bottom = Math.min(hl, hm) - rand(VALLEY_DEPTH_MIN, VALLEY_DEPTH_MAX);
        near = [...polyCut(base, 0, dv - vw), [dv, bottom], ...polyCut(base, dv + vw, g0)];
        blocked.push([dv - vw - 20, dv + vw + 20]);
        feature = { type: 'valley', dv, vw };
      } else feature = 'none';
    } else if (feature === 'pitfall'){
      const pdMin = featFrom + pw / 2 + 10, pdMax = g0 - pw / 2 - PIT_AFTER;
      if (pdMax > pdMin){
        const pd = rand(pdMin, pdMax);
        trap = { d0: pd - pw / 2, d1: pd + pw / 2 };
        blocked.push([trap.d0 - 25, trap.d1 + 25]);
      } else feature = 'none';
    } else if (feature === 'spring'){
      const dsMin = featFrom + 12, dsMax = g0 - 20;
      if (dsMax > dsMin){
        const ds = rand(dsMin, dsMax);
        spring = { d0: ds - SPRING_PAD_HALF, d1: ds + SPRING_PAD_HALF, boost: rand(SPRING_BOOST_MIN, SPRING_BOOST_MAX) };
        blocked.push([spring.d0 - 12, spring.d1 + 12]);
      } else feature = 'none';
    } else if (feature === 'stairs'){
      const stMin = featFrom + 16, stMax = g0 - 16;
      if (stMax > stMin){
        const z1 = stMin + (stMax - stMin) * 0.33, z2 = stMin + (stMax - stMin) * 0.66;
        near = [[0, polyH(base, 0)], [z1, polyH(base, z1) + STAIRS_RISE1], [z2, polyH(base, z2) + STAIRS_RISE2], [g0, polyH(base, g0)]];
        blocked.push([stMin - 10, stMax + 10]);
      } else feature = 'none';
    }
    const featureType = typeof feature === 'string' ? feature : feature.type;

    const farStartH = polyH(base, g1);
    const far = farType === 'up'
      ? [[g1, farStartH], [BOARD_W, polyH(base, BOARD_W)]]
      : [[g1, farStartH], [BOARD_W, Math.max(FAR_DOWN_MIN_H, farStartH - (BOARD_W - g1) * tan(rand(FAR_DOWN_MIN, FAR_DOWN_MAX)))]];
    const hAt = d => d <= g0 ? polyH(near, d) : polyH(far, d);
    const allPts = [...near, ...far];
    let maxH = Math.max(...allPts.map(p => p[1]));
    if (rock) maxH = Math.max(maxH, rock.h + rock.r);

    const extraRocks = [];
    if (event === 'rocks'){
      const n = rngFn() < 0.5 ? 1 : 2;
      for (let i = 0; i < n; i++){
        const dMin = featFrom + 15, dMax = g0 - 30;
        if (dMax <= dMin) break;
        const d = rand(dMin, dMax), r = rand(ROCK_R_MIN, ROCK_R_MAX);
        extraRocks.push({ d, r, h: polyH(base, d) + rand(ROCK_UP_MIN, ROCK_UP_MAX) + r });
      }
    }
    // N3 落石修飾詞：一般層每層額外吊岩（進入 lv.rocks，trial 碰撞共用）
    if (mod === 'rockfall' && !arena){
      for (let i = 0; i < MOD_ROCKFALL_EXTRA; i++){
        const dMin = featFrom + 15, dMax = g0 - 30;
        if (dMax <= dMin) break;
        const d = rand(dMin, dMax), r = rand(ROCK_R_MIN, ROCK_R_MAX);
        extraRocks.push({ d, r, h: polyH(base, d) + rand(ROCK_UP_MIN, ROCK_UP_MAX) + r });
      }
    }

    const yLow = prev ? prev.a.y + maxH + rand(CLEAR_MIN, CLEAR_MAX) : 0;
    const pt = d => ({ x: wx + dir * d, y: yLow - hAt(d) });
    const poly = pts => pts.map(([d, h]) => ({ x: wx + dir * d, y: yLow - h }));
    const toSegs = ps => ps.slice(1).map((q, i) => ({ a: ps[i], b: q }));
    const nearParts = trap ? [polyCut(near, 0, trap.d0), polyCut(near, trap.d1, g0)] : [near];
    const segs = [...nearParts.flatMap(pp => toSegs(poly(pp))), ...toSegs(poly(far))];

    const normalAt = d => {
      const e = 0.5, q0 = pt(Math.max(0, d - e)), q1 = pt(Math.min(BOARD_W, d + e));
      const tx = q1.x - q0.x, ty = q1.y - q0.y, l = Math.hypot(tx, ty);
      let nx = ty / l, ny = -tx / l;
      if (ny > 0){ nx = -nx; ny = -ny; }
      return { x: nx, y: ny };
    };
    const a = pt(0);
    const q1 = pt(Math.min(near[1][0], 20));
    const tl = Math.hypot(q1.x - a.x, q1.y - a.y);
    const t = { x: (q1.x - a.x) / tl, y: (q1.y - a.y) / tl };

    const holes = [];
    const onRail = (d, r) => { const q = pt(d), n = normalAt(d); return { x: q.x + n.x * COIN_R, y: q.y + n.y * COIN_R, r }; };
    if (featureType === 'valley'){
      const v = pt(feature.dv), pl = pt(feature.dv - feature.vw), pr = pt(feature.dv + feature.vw);
      const u = q => { const x = q.x - v.x, y = q.y - v.y, l = Math.hypot(x, y); return { x: x / l, y: y / l }; };
      const u1 = u(pl), u2 = u(pr), bx = u1.x + u2.x, by = u1.y + u2.y, bl = Math.hypot(bx, by);
      const sinA = Math.abs(u1.x * by - u1.y * bx) / bl;
      const dist = COIN_R / sinA;
      holes.push({ x: v.x + bx / bl * dist, y: v.y + by / bl * dist, r: VALLEY_HOLE_R, valley: true });
    }
    if (trap){
      const p0 = pt(trap.d0), p1 = pt(trap.d1);
      const top = Math.max(p0.y, p1.y);
      holes.push({ trap: true, x0: Math.min(p0.x, p1.x), x1: Math.max(p0.x, p1.x), yTop: top,
                   x: (p0.x + p1.x) / 2, y: top + 6, r: Math.abs(p1.x - p0.x) / 2 + 3 });
    }
    const midTo = g0 - MID_HOLE_GAP / 2;
    const ms = [];
    const want = event === 'treasure' ? 0 : Math.floor(rngFn() * (MID_HOLES_MAX + 1)) + (featureType === 'none' ? 1 : 0);
    for (let i = 0; i < want * 8 && ms.length < want && midTo > featFrom; i++){
      const d = rand(featFrom, midTo);
      if (ms.every(e => Math.abs(e - d) >= MID_HOLE_GAP) && blocked.every(([b0, b1]) => d < b0 || d > b1)) ms.push(d);
    }
    for (const d of ms) holes.push(onRail(d, rand(HOLE_R_MIN, HOLE_R_MAX)));
    holes.push(Object.assign(onRail(BOARD_W - COIN_R, rand(HOLE_R_MIN, HOLE_R_MAX)), { wall: true }));

    const rocks = [];
    if (rock) rocks.push({ x: wx + dir * rock.d, y: yLow - rock.h, r: rock.r });
    for (const er of extraRocks) rocks.push({ x: wx + dir * er.d, y: yLow - er.h, r: er.r });

    const s0 = (near[1][1] - near[0][1]) / (near[1][0] - near[0][0]);
    const rest = { x: wx - side * COIN_R, y: pt(COIN_R).y - COIN_R * Math.sqrt(1 + s0 * s0) };

    // 寶藏層寶石：3 顆置於軌道上方
    let gems = [];
    if (event === 'treasure' && mod !== 'rich'){
      for (let i = 0; i < GEM_PER_LEVEL; i++){
        const d = BOARD_W * (0.18 + 0.64 * (i / (GEM_PER_LEVEL - 1)));
        const q = pt(d);
        gems.push({ d, x: q.x, y: q.y - COIN_R - 4, taken: false });
      }
    }

    // v4 遺跡房岔路：每 8 層一岔；左右雙側皆生成獎勵區，待玩家到岔點選擇後封閉另一側
    let relic = null;
    if (!arena && world % RELIC_EVERY === 0){
      relic = { branch: null, closed: null, item: rollRelicItem() };
    }

    // ---- v4 機關：安全四項進自動生成池；mover/portal/rotor 僅手動，自動降級一般段 ----
    let mech = null;
    let decelMult = event === 'crystal' ? CRYSTAL_DECEL_MULT : 1;
    if (!arena && event !== 'treasure' && !simple){
      let m = null;
      if (rngFn() < MECH_RATE) m = pick(['ice', 'wind', 'breakRock', 'pad']);
      else if (!auto && rngFn() < MECH_MANUAL_RATE) m = pick(['mover', 'portal', 'rotor']);
      const md = rand(featFrom + 18, Math.max(featFrom + 20, g0 - 20));
      if (m === 'ice'){
        mech = { type: 'ice' };
        decelMult *= MECH_ICE_DECEL;
      } else if (m === 'wind'){
        mech = { type: 'wind', d0: md, d1: Math.min(g0, md + MECH_WIND_LEN), dir: dir };
      } else if (m === 'breakRock'){
        const br = rand(ROCK_R_MIN, ROCK_R_MAX);
        rocks.push({ x: wx + dir * md, y: yLow - polyH(base, md) - rand(ROCK_UP_MIN, ROCK_UP_MAX) - br, r: br, breakable: true, hp: MECH_BREAK_HP });
        mech = { type: 'breakRock' };
      } else if (m === 'pad'){
        mech = { type: 'pad', d0: md - 16, d1: md + 16, used: false };
      } else if (m === 'mover'){
        mech = { type: 'mover', d0: md - 16, d1: md + 16, t: 0, phase: rand(0, Math.PI * 2) };
      } else if (m === 'portal'){
        mech = { type: 'portal', a: Math.max(featFrom, md - 22), b: Math.min(g0, md + 22), t: 0, cd: 0 };
      } else if (m === 'rotor'){
        mech = { type: 'rotor', d: md, t: 0, phase: rand(0, Math.PI * 2) };
      }
    }

    rngFn = savedRng;
    return { side, a, t, topY: yLow - maxH, segs, holes, rocks, rest, gapPos, slopeType, featureType, farType,
             event, arena, world, spring, gems, mech, relic, decelMult };
  }

  // ---- 配置生成（跨幀漸進，保留既有求解／後備語意） ----
  let failK = -1, failN = 0;
  function noteFail(k){ if (failK === k) failN++; else { failK = k; failN = 1; } }
  function retryLevel(k){
    noteFail(k);
    if (failN >= FAIL_BACK && k - 1 > here + 1){
      levels.pop();
      failK = k - 1; failN = FAIL_SIMPLE;
      gen = null;
      return true;
    }
    if (failN >= FAIL_GIVEUP) return false;
    gen = null;
    return true;
  }
  let gen = null;
  let genBudget = GEN_TRIALS_PER_FRAME;   // R1：單幀 trial 計數後備；主上限為 genDeadline 時間片
  let genDeadline = 0;                    // R1：本幀生成截止時刻（performance.now 時間戳，僅排程）
  function genStep(){
    const k = levels.length, prev = levels[k - 1];
    if (!gen || gen.k !== k) gen = { k, tries: 0, pick: null, score: Infinity, center: undefined, cand: null };
    if (gen.verify){ verifyStep(); return; }
    if (!gen.cand){
      gen.cand = randomLevel(k, prev);
      Object.assign(gen, { p: WIN_STEP, w: 0, landMin: Infinity, landMax: -Infinity, sw: 0, ssum: 0, smin: Infinity, smax: -Infinity, sstrong: false, sstuck: false });
    }
    levels.push(gen.cand);
    do {
      if (genBudget <= 0 || performance.now() >= genDeadline) return;  // R1：額度或時間片用盡，保留狀態下幀續跑
      const res = trial(k - 1, gen.p / 100);
      genBudget--;
      if (res === 'landhole' && (trialLandHole.valley || trialLandHole.trap)){
        gen.cand = null; levels.pop(); gen.tries++; return;
      }
      if (res === 'landhole'){
        gen.cand.holes = gen.cand.holes.filter(h => h !== trialLandHole);
        Object.assign(gen, { p: WIN_STEP, w: 0, landMin: Infinity, landMax: -Infinity, sw: 0, ssum: 0, smin: Infinity, smax: -Infinity, sstrong: false, sstuck: false });
        continue;
      }
      gen.landMin = Math.min(gen.landMin, trialLandMin); gen.landMax = Math.max(gen.landMax, trialLandMax);
      if (res === 'next') gen.w += WIN_STEP;
      const self = trial(k, gen.p / 100);
      genBudget--;
      if (self === 'lost'){
        gen.sw += WIN_STEP; gen.ssum += gen.p;
        gen.smin = Math.min(gen.smin, gen.p); gen.smax = Math.max(gen.smax, gen.p);
        if (gen.p >= STRONG_FROM) gen.sstrong = true;
      }
      if (self === 'stuck') gen.sstuck = true;
      gen.p += WIN_STEP;
    } while (gen.p <= 100);
    levels.pop();
    if (gen.p <= 100) return;

    if (gen.landMin <= gen.landMax){
      gen.cand.holes = gen.cand.holes.filter(h => h.wall || h.valley || h.trap || h.x + h.r < gen.landMin - LAND_PAD || h.x - h.r > gen.landMax + LAND_PAD);
    }

    const winLo = kk => WIN_MIN0 + (WIN_MIN_END - WIN_MIN0) * Math.min(1, kk / WIN_LEVELS);
    const winHi = kk => WIN_MAX0 + (WIN_MAX_END - WIN_MIN0) * Math.min(1, kk / WIN_LEVELS);
    const c = gen.sw ? gen.ssum / (gen.sw / WIN_STEP) : 0;
    let score = 0;
    if (gen.w < Math.min(winLo(k - 1), prev.selfW || Infinity)) score += 100;
    if (gen.sw < winLo(k)) score += 200 + (winLo(k) - gen.sw);
    if (gen.sstuck) score += 200;
    if (gen.sstrong) score += 50;
    score += Math.max(0, gen.sw - winHi(k));
    if (prev.selfCenter !== undefined && prev.selfCenter >= gen.smin - SHIFT_MIN / 2 && prev.selfCenter <= gen.smax + SHIFT_MIN / 2) score += 60;
    if (gen.cand.featureType === 'none' || gen.cand.featureType === prev.featureType) score += VARIETY_PENALTY;
    if (score < gen.score){ gen.pick = gen.cand; gen.score = score; gen.center = c; gen.pickSW = gen.sw; }
    gen.cand = null;
    gen.tries++;
    if (gen.score === 0 || (gen.tries >= VARIETY_TRIES && gen.score <= VARIETY_PENALTY) || gen.tries >= GEN_TRIES){
      if (gen.score >= 100 && retryLevel(k)) return;
      gen.verify = { p: 1, min: Infinity, max: -Infinity };
    }
  }

  function verifyStep(){
    const k = gen.k, v = gen.verify;
    if (levels[levels.length - 1] !== gen.pick) levels.push(gen.pick);
    let bad = false;
    do {
      if (genBudget <= 0 || performance.now() >= genDeadline) return;  // R1：額度或時間片用盡下幀續跑
      const res = trial(k - 1, v.p / 100);
      genBudget--;
      if (res === 'stuck' || (res === 'landhole' && (trialLandHole.valley || trialLandHole.trap))){ bad = true; break; }
      if (res === 'landhole') gen.pick.holes = gen.pick.holes.filter(h => h !== trialLandHole);
      else { v.min = Math.min(v.min, trialLandMin); v.max = Math.max(v.max, trialLandMax); v.p++; }
    } while (v.p <= 100);
    levels.pop();
    if (bad && retryLevel(k)) return;
    if (v.p <= 100) return;
    if (v.min <= v.max){
      const near = (h, pad) => h.trap ? !(h.x1 < v.min - pad || h.x0 > v.max + pad) : !(h.x + h.r < v.min - pad || h.x - h.r > v.max + pad);
      if (gen.pick.holes.some(h => (h.valley || h.trap) && near(h, LAND_PAD_FEATURE)) && retryLevel(k)) return;
      gen.pick.holes = gen.pick.holes.filter(h => h.wall || h.valley || h.trap || !near(h, LAND_PAD));
    }
    gen.pick.selfCenter = gen.center;
    gen.pick.selfW = gen.pickSW;
    gen.pick.selfMin = gen.smin;
    gen.pick.selfMax = gen.smax;
    levels.push(gen.pick);
    gen = null;
  }
  function ensureLevels(need){
    while (levels.length < here + need && genBudget > 0 && performance.now() < genDeadline) genStep();
  }

  function placeAt(i){
    const r = levels[i].rest;
    coin = { x: r.x, y: r.y, vx: 0, vy: 0, still: 0, springUsed: false };
    trail = [];
  }

  function seedFromString(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  // B1：段內容 = 主種子 ⊕ 段索引 ⊕ 重試次數 的純函數；每段自帶獨立 mulberry32，不讀 wall clock
  function segSeed(master, k){
    let h = (master >>> 0) ^ Math.imul((k >>> 0) + 1, 2654435761);
    h = Math.imul(h ^ (h >>> 13), 2246822519);
    h ^= h >>> 16;
    return h >>> 0;
  }
  function reset(){
    // RNG：每日／殘局／自訂種子走 seeded；一般模式維持原本隨機
    // B1：先算主種子，段內容由主種子＋段索引派生，生成決策不讀 wall clock
    if (dailyMode) masterSeed = parseInt(todayStr(), 10) || 1;
    else if (gameMode === 'puzzle' && modeSeed != null) masterSeed = modeSeed;
    else if (customSeed) masterSeed = seedFromString(customSeed);
    else masterSeed = Math.floor(Math.random() * 1e9);
    gen = null;   // B1：先清空生成器殘留，段種子不得吃到上一局的 tries
    rngFn = (dailyMode || (gameMode === 'puzzle' && modeSeed != null) || customSeed) ? mulberry32(masterSeed) : Math.random;
    mod = rollModifier();
    if (mod !== 'calm') discover('modifier', mod);
    here = 0;
    levels = [randomLevel(0, null)];
    gen = null;
    genBudget = GEN_TRIALS_PER_FRAME;
    genDeadline = performance.now() + GEN_FRAME_MS * 3;  // R1：開場時間片放寬至 9ms，其餘由長跑幀續補
    ensureLevels(LEVELS_START);
    if (gameMode === 'puzzle'){
      ensureLevels(RELIC_START_FLOOR + ARENA_LEN + 2);
      let target = levels.findIndex(lv => !lv.arena && lv.world === RELIC_START_FLOOR);
      if (target < 0) target = levels.findIndex(lv => !lv.arena && lv.world >= RELIC_START_FLOOR);
      here = Math.max(0, Math.min(target >= 0 ? target : RELIC_START_FLOOR - 1, levels.length - 1));
    }
    placeAt(here);
    power = 0; acc = 0; charging = false; chargeSource = null;
    autoRetryT = 0; autoStallT = 0; autoTarget = 0;
    autoSol.clear(); autoFail.clear(); autoSolver = null; autoLastLaunch = -1;
    boss = null;
    banner.t = banner.dur;
    state = 'play';
    camY = coin.y - viewH() * COIN_SCREEN_Y;
    run = { segments: 0, gems: 0, launchPower: 0, firstTry: true, streak: 0, bandStreak: 0, arenaDeath: false, guardUses: 0, firstLaunch: false };
    arenaRun = { damaged: false };
    toastText = ''; shopLockT = 0;
    // v4 本局資料初始化
    shieldCount = suite.startShield * SUITE_DEFS[1].per + passive.armorPlate;
    inv = { shield: shieldCount, drill: 0, magnet: 0 };
    if (inv.shield > 0) discover('item', 'shield');
    dashUsedFlight = 0; dashUsedRun = 0; rerollUsed = 0; relicBranch = null;
    sprintClock = SPRINT_START_TIME; rushStreak = 0; rushWonThisRun = 0; b20Time = 0;
    if (suite.startCoin > 0){ const sc = suite.startCoin * SUITE_DEFS[0].per; coins = Math.max(0, Math.min(1e9, Math.floor(coins + sc))); saveJSON(COINS_KEY, coins); }
    if (mod !== 'calm'){ showBanner(MOD_DEFS[mod].n + '修飾'); sfx.modEnter(); }
    lastPowers = [];
    particles = [];
    shake = { t: 0, dur: 0, mag: 0 };
    runPaid = new Set();
    arenaPaid = new Set();
    coinJumpT = 0; lastItemUse = -1; lastDashUse = -1;
    stats.runs = safeCount(stats.runs + 1, 0);  // R5：遞增後再夾制，避免 read-modify-write 越界
    saveJSON(STATS_KEY, stats);
    $('over').classList.add('hidden');
  }

  // ================= 自動遊玩（保留既有求解器與快取語意） =================
  function autoPickPower(){
    const lv = levels[here];
    if (lv){
      if (lv.selfMin !== undefined && lv.selfMax !== undefined && lv.selfMax > lv.selfMin){
        return Math.max(0.05, Math.min(1, (lv.selfMin + lv.selfMax) / 200));
      }
      if (lv.selfCenter !== undefined && isFinite(lv.selfCenter)){
        return Math.max(0.05, Math.min(1, lv.selfCenter / 100));
      }
    }
    return 0.55;
  }
  function solverStart(k){
    return { k, phase: 'coarse', p: 0.10, coarseWinners: [], fineWinners: [], fineLo: 0, fineHi: 0, solution: null };
  }
  function solverStep(s, until){
    if (s.phase === 'coarse'){
      do {
        if (performance.now() >= until) return 'working';  // R1：求解同樣受時間片節制
        if (trial(s.k, s.p) === 'next') s.coarseWinners.push(s.p);
        s.p += 0.05;
      } while (s.p <= 1.001);
      if (s.p <= 1.001) return 'working';
      if (s.coarseWinners.length){
        const w = s.coarseWinners[0];
        s.fineLo = Math.max(0.05, w - 0.06); s.fineHi = Math.min(1, w + 0.06);
        s.p = s.fineLo; s.phase = 'fine';
      } else {
        s.p = 0.05; s.phase = 'finefull';
      }
    }
    if (s.phase === 'fine' || s.phase === 'finefull'){
      const hi = s.phase === 'fine' ? s.fineHi : 1.0;
      do {
        if (performance.now() >= until) return 'working';  // R1：求解時間片節制
        if (trial(s.k, s.p) === 'next') s.fineWinners.push(+s.p.toFixed(2));
        s.p += 0.01;
      } while (s.p <= hi + 1e-6);
      if (s.p <= hi + 1e-6) return 'working';
      if (s.fineWinners.length){
        s.solution = s.fineWinners[Math.floor((s.fineWinners.length - 1) / 2)];
        return 'solved';
      }
      return 'none';
    }
    return 'none';
  }
  function autoUpdate(dt){
    if (!auto) return;
    if (state === 'over'){   // 結算後僅計時自動重開，不進入求解／蓄力
      autoRetryT += dt;
      if (autoRetryT >= 1.0){ autoRetryT = 0; reset(); }
      return;
    }
    if (state !== 'play') return;
    if (boss && boss.mode === 'cut') return;

    if (autoSolver){
      const res = solverStep(autoSolver, performance.now() + 5);
      if (res === 'working') return;
      if (res === 'solved') autoSol.set(autoSolver.k, autoSolver.solution);
      else if (res === 'none') autoFail.add(autoSolver.k);
      autoSolver = null;
    }

    if (charging){
      if (power >= autoTarget){ power = autoTarget; flick(); }
      return;
    }
    if (!atLever(here)) return;
    if (Math.hypot(coin.vx, coin.vy) >= REST_V || coin.still <= REST_TIME) return;

    if (here === autoLastLaunch && autoSol.has(here)){
      autoSol.delete(here);
      autoLastLaunch = -1;
    }
    let p = autoSol.get(here);
    if (p !== undefined){
      if (trial(here, p) !== 'next'){ autoSol.delete(here); p = undefined; }
    }
    if (p === undefined && autoFail.has(here)) p = autoPickPower();
    // R3：兜底力道發射前再驗證；非 next 則不硬擲，交回求解器分幀重算（不在單幀全掃 trial）
    if (p !== undefined && trial(here, p) !== 'next') p = undefined;

    if (p !== undefined){
      const r = levels[here].rest;
      coin.x = r.x; coin.y = r.y; coin.vx = 0; coin.vy = 0; coin.still = 0;
      autoTarget = p;
      autoLastLaunch = here;
      autoStallT = 0;
      startCharge(false);
    } else if (!autoSolver){
      // R3：本段已確認無解且兜底力道亦不過驗，靜止逾時即安全重開，不硬擲、不卡段
      if (autoFail.has(here)){
        autoStallT += dt;
        if (autoStallT >= AUTO_STALL_S){ autoStallT = 0; autoRetryT = 0; reset(); return; }
      } else {
        autoStallT = 0;
        autoSolver = solverStart(here);
      }
    }
  }

  // ================= 操作 =================
  function startCharge(manual){
    if (state !== 'play' || charging) return;

  function launch(c, k, p){
    const lv = levels[k];
    const vmax = V_MAX * coinTypeDef().vmax;
    c.vx = lv.t.x * p * vmax;
    c.vy = lv.t.y * p * vmax;
    c.still = 0;
    c.springUsed = false;
  }
  const atLever = k => Math.hypot(coin.x - levels[k].rest.x, coin.y - levels[k].rest.y) < LEVER_REACH;
  function flick(){
    if (!charging) return;
    charging = false;
    chargeSource = null;
    if (boss && boss.mode === 'cut'){ power = 0; return; }
    if (state === 'play' && atLever(here)){
      // 彈簧靴初速加成僅作用於手動發射；自動／trial／預覽路徑不套用，保持物理純淨
      const isManual = chargeSource === 'pointer' || chargeSource === 'key';
      const launchPower = isManual ? Math.min(1, power * springLaunchMult()) : power;
      launch(coin, here, launchPower);
      run.launchPower = launchPower;
      run.firstTry = true;
      run.firstLaunch = true;
      dashUsedFlight = 0;
      if (!firstLaunchDone){ firstLaunchDone = true; saveJSON('endlessShinkansen.firstLaunchDone', true); }
      sfx.launch();
    }
    power = 0;
  }

  // ---- v4 道具（自動模式不使用） ----
  function magnetRadius(){ return MAGNET_RADIUS + suite.magnetR * SUITE_DEFS[2].per; }
  function useItem(id){
    // B6：state play、非覆蓋層、非自動、持有足夠、冷卻與同幀去重守衛
    if (auto || state !== 'play' || panelOpen()) return;
    if (!ITEM_DEFS[id] || inv[id] <= 0) return;
    if (clock - lastItemUse < ITEM_COOLDOWN) return;
    if (boss && boss.mode === 'cut') return;
    lastItemUse = clock;
    if (id === 'shield'){ toastText = '護盾已就緒'; toastT = 0; return; }
    if (id === 'drill'){
      const lv = levels[here];
      if (!lv) return;
      let best = null, bd = Infinity;
      for (const rk of lv.rocks){
        if (!rk.breakable) continue;
        const d = Math.hypot(coin.x - rk.x, coin.y - rk.y);
        if (d < bd){ bd = d; best = rk; }
      }
      if (!best){ toastText = '附近沒有可鑽岩塊'; toastT = 0; return; }
      lv.rocks.splice(lv.rocks.indexOf(best), 1);
      inv.drill--; discover('item', 'drill');
      spawnParticles(best.x, best.y, SPARK_COUNT, col['coin-hi'], 150, 0.5);
      sfx.armorBreak();
    } else if (id === 'magnet'){
      const R = magnetRadius();
      let taken = 0;
      for (let i = Math.max(0, here - 1); i <= Math.min(levels.length - 1, here + 1); i++){
        for (const g of levels[i].gems){
          if (!g.taken && Math.hypot(coin.x - g.x, coin.y - g.y) < R){
            g.taken = true; run.gems++; taken++;
            spawnParticles(g.x, g.y, SPARK_COUNT, col['crystal'], 130, 0.4);
          }
        }
      }
      if (taken === 0){ toastText = '半徑內沒有寶石'; toastT = 0; return; }
      inv.magnet--; discover('item', 'magnet');
      if (run.gems >= GEM_PER_LEVEL) unlock('gem3');
      if (run.gems >= 5) unlock('gem5');
      sfx.gem();
    }
    renderHUD();
  }

  // ---- v4 二段蓄力（僅手動；每次飛行 1 次、每局限 2 次） ----
  function dashBoost(){
    // B7：僅手動、play、在空中、非過場；每飛行 1 次、每局 2 次、冷卻 0.2s
    if (auto || state !== 'play' || panelOpen() || charging) return;
    if (boss && boss.mode === 'cut') return;
    const dashFlightMax = DASH_PER_FLIGHT + dashBonus();
    const dashRunMax = DASH_PER_RUN + dashBonus();
    if (dashUsedFlight >= dashFlightMax || dashUsedRun >= dashRunMax) return;
    if (clock - lastDashUse < DASH_COOLDOWN) return;
    const sp = Math.hypot(coin.vx, coin.vy);
    if (sp < REST_V) return;
    const nx = coin.vx / sp, ny = coin.vy / sp;
    const boost = V_MAX * DASH_MULT * coinTypeDef().vmax;
    coin.vx += nx * boost; coin.vy += ny * boost;
    // 補推後夾在速度上限，避免穿透軌道
    const cap = DASH_SPEED_CAP * coinTypeDef().vmax;
    const nsp = Math.hypot(coin.vx, coin.vy);
    if (nsp > cap){ coin.vx *= cap / nsp; coin.vy *= cap / nsp; }
    dashUsedFlight++; dashUsedRun++; lastDashUse = clock;
    spawnParticles(coin.x, coin.y, SPARK_COUNT, col['coin-hi'], 140, 0.4);
    sfx.launch();
  }

  // ================= 粒子／震動 =================
  function spawnParticles(x, y, n, color, speed, life){
    if (!settings.fx) return;
    for (let i = 0; i < n; i++){
      if (particles.length >= PARTICLE_MAX) break;
      const a = rand(0, Math.PI * 2), v = rand(speed * 0.4, speed);
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, t: 0, life: rand(life * 0.6, life), color });
    }
  }
  function updateParticles(dt){
    for (const p of particles){
      p.t += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += G * 0.15 * dt;
      p.x = Math.max(0, Math.min(BOARD_W, p.x));   // 粒子不得溢出棋盤
    }
    particles = particles.filter(p => p.t < p.life);
  }
  function addShake(mag, dur){
    if (!settings.fx) return;
    shake.mag = Math.max(shake.mag, Math.min(SHAKE_MAX, mag));
    shake.dur = Math.max(shake.dur, Math.min(SHAKE_TIME, dur));
    shake.t = 0;
  }

  const worldOf = i => levels[i] ? levels[i].world : i + 1;
  function floorInfo(i){

    $('result').textContent = '抵達 ' + floorInfo(here).main;
    $('best').textContent = '最深紀錄 B' + best + '　' + VERSION_TAG;
    $('statLine').textContent = '通過 ' + run.segments + ' 段　寶石 ' + run.gems + ' 顆　金幣 ' + coins;
