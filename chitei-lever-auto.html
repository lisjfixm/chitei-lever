  // ================= 物理 =================
  function collideRail(c, sg, h, decelMult){
    const def = coinTypeDef();
    const ax = sg.a.x, ay = sg.a.y, dx = sg.b.x - ax, dy = sg.b.y - ay;
    let u = ((c.x - ax) * dx + (c.y - ay) * dy) / (dx * dx + dy * dy);
    const corner = u <= 0 || u >= 1;
    u = Math.max(0, Math.min(1, u));
    const qx = ax + u * dx, qy = ay + u * dy;
    const ex = c.x - qx, ey = c.y - qy, d = Math.hypot(ex, ey);
    if (d >= COIN_R || d < 1e-6) return;
    c.onRail = true;
    const nx = ex / d, ny = ey / d;
    c.x = qx + nx * COIN_R; c.y = qy + ny * COIN_R;
    const vn = c.vx * nx + c.vy * ny;
    if (vn < 0){
      const e = !corner && -vn > def.bounceMin ? def.bounce : 0;
      c.vx -= (1 + e) * vn * nx; c.vy -= (1 + e) * vn * ny;
    }
    const tx = -ny, ty = nx;
    const vt = c.vx * tx + c.vy * ty, vn2 = c.vx * nx + c.vy * ny;
    const dec = def.decel * (decelMult || 1);
    const nvt = Math.sign(vt) * Math.max(0, Math.abs(vt) - dec * h);
    c.vx = nvt * tx + vn2 * nx; c.vy = nvt * ty + vn2 * ny;
  }

  function collideRock(c, rk, h){
    const def = coinTypeDef();
    const dx = c.x - rk.x, dy = c.y - rk.y, d = Math.hypot(dx, dy), m = COIN_R + rk.r;
    if (d >= m || d < 1e-6) return;
    const nx = dx / d, ny = dy / d;
    c.x = rk.x + nx * m; c.y = rk.y + ny * m;
    const vn = c.vx * nx + c.vy * ny;
    if (vn < 0){
      if (rk.breakable && def.heavy){ rk.hp -= 1; if (rk.hp <= 0) rk.dead = true; return; }
      if (def.heavy){
        // 重型撞一般輕岩：吸收法向衝量，貼著滑過，不反射脫軌
        c.vx -= vn * nx; c.vy -= vn * ny;
        return;
      }
      const rb = ROCK_BOUNCE * def.rockDeflect;
      c.vx -= (1 + rb) * vn * nx; c.vy -= (1 + rb) * vn * ny;
    }
  }

  function segUnder(c, lv){
    let best = null, bd = Infinity;
    for (const sg of lv.segs){
      const ax = sg.a.x, ay = sg.a.y, dx = sg.b.x - ax, dy = sg.b.y - ay;
      const u = Math.max(0, Math.min(1, ((c.x - ax) * dx + (c.y - ay) * dy) / (dx * dx + dy * dy)));
      const qx = ax + u * dx, qy = ay + u * dy;
      const d = Math.hypot(c.x - qx, c.y - qy);
      if (d < bd){ bd = d; best = sg; }
    }
    return best;
  }

  function simStep(c, k, h, real){
    c.onRail = false;
    c.vy += G * h;
    c.x += c.vx * h; c.y += c.vy * h;
    if (c.x < COIN_R){ c.x = COIN_R; if (c.vx < 0) c.vx = -c.vx * WALL_BOUNCE; }
    if (c.x > BOARD_W - COIN_R){ c.x = BOARD_W - COIN_R; if (c.vx > 0) c.vx = -c.vx * WALL_BOUNCE; }
    const from = Math.max(0, k - 1), to = Math.min(levels.length - 1, k + 2);
    for (let i = from; i <= to; i++){
      const lv = levels[i];
      for (const sg of lv.segs) collideRail(c, sg, h, lv.decelMult);
      for (const rk of lv.rocks) collideRock(c, rk, h);
      if (lv.rocks.some(r => r.dead)) lv.rocks = lv.rocks.filter(r => !r.dead);
      // 彈簧台：著地一次性額外加速
      if (lv.spring && !c.springUsed){
        const d = lv.side < 0 ? c.x : BOARD_W - c.x;
        if (d >= lv.spring.d0 && d <= lv.spring.d1){
          const sg = segUnder(c, lv);
          if (sg){
            const dx = sg.b.x - sg.a.x, dy = sg.b.y - sg.a.y, l = Math.hypot(dx, dy) || 1;
            const dir = c.vx >= 0 ? 1 : -1;
            c.vx += dx / l * lv.spring.boost * dir;
            c.vy += dy / l * lv.spring.boost * dir;
            c.springUsed = true;
            if (real) spawnParticles(c.x, c.y, DUST_COUNT, col.coin, 120, 0.4);
          }
        }
      }
      // v4 風場：沿軌道方向推力（trial 同步套用）
      if (lv.mech && lv.mech.type === 'wind'){
        const wd = lv.side < 0 ? c.x : BOARD_W - c.x;
        if (wd >= lv.mech.d0 && wd <= lv.mech.d1) c.vx += MECH_WIND_FORCE * lv.mech.dir * h;
      }
      // v4 緩衝墊：每層一次接住墜落金貨並彈回（trial 同步）
      if (lv.mech && lv.mech.type === 'pad' && !lv.mech.used && c.vy > 0){
        const pd = lv.side < 0 ? c.x : BOARD_W - c.x;
        if (pd >= lv.mech.d0 && pd <= lv.mech.d1){
          const ry = railY(lv, pd);
          if (c.y > ry + COIN_R + 6){
            c.y = ry + COIN_R + 6;
            c.vy = -Math.abs(c.vy) * MECH_PAD_BOUNCE;
            lv.mech.used = true;
            if (real) spawnParticles(c.x, c.y, DUST_COUNT, col.coin, 120, 0.4);
          }
        }
      }
      // v4 移動平台：週期往返，平台帶動其上金貨（trial 同步；僅手動生成）
      if (lv.mech && lv.mech.type === 'mover'){
        const m = lv.mech; m.t += h;
        const mid = (m.d0 + m.d1) / 2;
        const off = MECH_MOVER_AMP * Math.sin(2 * Math.PI * m.t / MECH_MOVER_PERIOD + m.phase);
        const pd = Math.max(m.d0, Math.min(m.d1, mid + off));
        const px = lv.side < 0 ? pd : BOARD_W - pd;
        const py = railY(lv, pd);
        const prevOff = MECH_MOVER_AMP * Math.sin(2 * Math.PI * (m.t - h) / MECH_MOVER_PERIOD + m.phase);
        const prevPd = Math.max(m.d0, Math.min(m.d1, mid + prevOff));
        const prevPx = lv.side < 0 ? prevPd : BOARD_W - prevPd;
        if (Math.abs(c.y - (py - COIN_R)) < COIN_R + 3 && Math.abs(c.x - px) < MECH_MOVER_HALF + COIN_R){
          c.x += px - prevPx;
        }
      }
      // v4 傳送門：成對傳送，保留水平速度，冷卻避免來回彈跳（trial 同步；僅手動生成）
      if (lv.mech && lv.mech.type === 'portal'){
        const m = lv.mech; m.t += h; if (m.cd > 0) m.cd -= h;
        const pa = { x: lv.side < 0 ? m.a : BOARD_W - m.a, y: railY(lv, m.a) - COIN_R - 2 };
        const pb = { x: lv.side < 0 ? m.b : BOARD_W - m.b, y: railY(lv, m.b) - COIN_R - 2 };
        if (m.cd <= 0){
          if (Math.hypot(c.x - pa.x, c.y - pa.y) < MECH_PORTAL_R + COIN_R){
            c.x = pb.x; c.y = pb.y; c.vy *= 0.4; m.cd = MECH_PORTAL_FADE;
          } else if (Math.hypot(c.x - pb.x, c.y - pb.y) < MECH_PORTAL_R + COIN_R){
            c.x = pa.x; c.y = pa.y; c.vy *= 0.4; m.cd = MECH_PORTAL_FADE;
          }
        }
      }
      // v4 旋槓：週期掃過，端點圓碰撞（trial 同步；僅手動生成）
      if (lv.mech && lv.mech.type === 'rotor'){
        const m = lv.mech; m.t += h;
        const pivot = { x: lv.side < 0 ? m.d : BOARD_W - m.d, y: railY(lv, m.d) - 10 };
        const ang = 2 * Math.PI * m.t / MECH_ROTOR_PERIOD + m.phase;
        const ex = pivot.x + MECH_ROTOR_ARM * Math.cos(ang);
        const ey = pivot.y + MECH_ROTOR_ARM * Math.sin(ang);
        const dx = c.x - ex, dy = c.y - ey, d = Math.hypot(dx, dy), rr = MECH_ROTOR_R + COIN_R;
        if (d < rr && d > 1e-6){
          const nx = dx / d, ny = dy / d;
          c.x = ex + nx * rr; c.y = ey + ny * rr;
          const vn = c.vx * nx + c.vy * ny;
          if (vn < 0){ const rb = ROCK_BOUNCE * 0.5; c.vx -= (1 + rb) * vn * nx; c.vy -= (1 + rb) * vn * ny; }
        }
      }
      // 寶石拾取（僅實機）
      if (real) for (const g of lv.gems){
        if (!g.taken && Math.hypot(c.x - g.x, c.y - g.y) < COIN_R + 5){
          g.taken = true;
          run.gems++;
          sfx.gem();
          spawnParticles(g.x, g.y, SPARK_COUNT, col['coin-hi'], 140, 0.5);
          if (run.gems >= GEM_PER_LEVEL) unlock('gem3');
          if (run.gems >= 5) unlock('gem5');
        }
      }
    }
    const sp = Math.hypot(c.vx, c.vy);
    for (let i = from; i <= to; i++){
      for (const ho of levels[i].holes){
        if (ho.trap){
          if (c.x > ho.x0 && c.x < ho.x1 && c.y > ho.yTop + 2 && c.y < ho.yTop + TRAP_DEPTH) return { hole: ho, level: i };
          continue;
        }
        const inside = ho.wall
          ? Math.abs(c.x - ho.x) < ho.r && c.y > ho.y - ho.r - WALL_HOLE_REACH && c.y < ho.y + ho.r - 2
          : Math.hypot(c.x - ho.x, c.y - ho.y) < ho.r - COIN_R + HOLE_FIT;
        if (inside && Math.abs(c.vx) < HOLE_PASS_V) return { hole: ho, level: i };
      }
    }
    c.still = sp < REST_V ? c.still + h : 0;
    if (c.still > REST_TIME){
      for (let i = from; i <= to; i++){
        const r = levels[i].rest;
        if (Math.hypot(c.x - r.x, c.y - r.y) < REST_DIST) return { rest: i };
      }
      if (sp < STUCK_V){ c.stop = (c.stop || 0) + h; if (c.stop > STUCK_TIME) return { stuck: true }; }
      else c.stop = 0;
    }
    return null;
  }

  let trialLandHole = null;
  let trialLandMin = Infinity, trialLandMax = -Infinity;
  function touching(c, lv){
    for (const sg of lv.segs){
      const ax = sg.a.x, ay = sg.a.y, dx = sg.b.x - ax, dy = sg.b.y - ay;
      const u = Math.max(0, Math.min(1, ((c.x - ax) * dx + (c.y - ay) * dy) / (dx * dx + dy * dy)));
      if (Math.hypot(c.x - ax - u * dx, c.y - ay - u * dy) < COIN_R + 1) return true;
    }
    return false;
  }
  function trial(k, p){
    const r = levels[k].rest;
    const c = { x: r.x, y: r.y, vx: 0, vy: 0, still: 0, springUsed: false };
    launch(c, k, p);
    const n = Math.round(SIM_TIME / STEP);
    const floor = levels[Math.min(levels.length - 1, k + 2)].a.y + 100;
    const lower = levels[k + 1];
    trialLandMin = Infinity; trialLandMax = -Infinity;
    let landed = false;
    for (let i = 0; i < n && c.y < floor; i++){
      const e = simStep(c, k, STEP, false);
      if (!landed && lower && c.y > lower.topY - COIN_R * 2 && touching(c, lower)) landed = true;
      if (landed){ trialLandMin = Math.min(trialLandMin, c.x); trialLandMax = Math.max(trialLandMax, c.x); }
      if (!e) continue;
      if (e.hole){
        if (e.level > k){ trialLandHole = e.hole; return 'landhole'; }
        return 'hole';
      }
      if (e.stuck) return 'stuck';
      return e.rest > k ? 'next' : e.rest === k ? 'retry' : 'lost';
    }
    return 'lost';
  }

  function railY(lv, d){
    if (!lv || !lv.segs.length) return 0;
    const x = lv.side < 0 ? d : BOARD_W - d;
    for (const sg of lv.segs){
      const x0 = Math.min(sg.a.x, sg.b.x), x1 = Math.max(sg.a.x, sg.b.x);
      if (x >= x0 - 0.5 && x <= x1 + 0.5 && Math.abs(sg.b.x - sg.a.x) > 1e-6){
        const u = (x - sg.a.x) / (sg.b.x - sg.a.x);
        return sg.a.y + (sg.b.y - sg.a.y) * u;
      }
    }
    return lv.segs[0].a.y;
  }

  // ================= 金幣發放（僅 here 真前進且本段未發過） =================
  // 取整順序：先算基礎值（一般層含深度係數／事件加成；競技場段固定 8，不套深度）→
  // 乘金幣加成 → Math.round → 至少 1；競技場整場 50 同口徑（不套深度係數）
  function awardCoins(lv){
    let amount;
    if (lv.arena){
      amount = COIN_ARENA_SEG;
    } else {
      const depth = Math.min(COIN_DEPTH_CAP, 1 + lv.world * COIN_DEPTH_RATE);
      amount = COIN_BASE * depth;
      const ev = COIN_EVENT_BONUS[lv.event];
      if (ev) amount += ev;
    }
    const mult = coinMult() * MOD_DEFS[mod].coin * (dailyMode ? DAILY_COIN_MULT : 1);
    amount = Math.max(1, Math.round(amount * mult));
    coins = Math.min(1e9, coins + amount);
    stats.coinTotal = safeCount(stats.coinTotal + amount, 0);
    if (stats.coinTotal >= 500) unlock('coin500');
    if (stats.coinTotal >= 2000) unlock('coin2000');
    saveJSON(COINS_KEY, coins);
    coinPulse();
  }
  function coinPulse(){
    coinJumpT = COIN_JUMP_TIME;
    if (coin && state === 'play'){
      spawnParticles(coin.x, coin.y - COIN_R, Math.min(COIN_PARTICLE_MAX, 6), col.coin, 90, 0.45);
    }
  }

  // ================= 到達新段事件 =================
  // ---- v4 每日三任務進度（與每日挑戰分開記錄，跨日重置） ----
  function updateTaskProgress(lv){
    if (!dailyTasks) return;
    for (const t of dailyTasks.list){
      const def = TASK_DEFS.find(x => x.id === t.id);
      if (!def) continue;
      let p = t.prog;
      switch (t.id){
        case 'streak8': p = Math.max(p, Math.min(def.target, run.streak)); break;
        case 'deep30': p = Math.max(p, Math.min(def.target, lv.world)); break;
        case 'coin500': p = Math.min(def.target, stats.coinTotal); break;
        case 'rush2': p = Math.max(p, Math.min(def.target, rushStreak)); break;
        case 'cleanArena': if (lv.arena && lv.arena.exit && !arenaRun.damaged) p = def.target; break;
      }
      t.prog = p;
      if (p >= def.target) t.done = true;
    }
    saveJSON(DAILY_TASK_KEY, dailyTasks);
  }

  // v4 遺跡房岔路：加權隨機道具（福袋同口徑）
  function rollRelicItem(){
    const keys = Object.keys(BAG_WEIGHT);
    let acc = 0, r = rngFn() * keys.reduce((s, k) => s + BAG_WEIGHT[k], 0), pick = keys[0];
    for (const k of keys){ acc += BAG_WEIGHT[k]; if (r < acc){ pick = k; break; } }
    return pick;
  }
  function chooseRelic(side){
    const lv = levels[here];
    if (!lv || !lv.relic || lv.relic.branch) return;
    lv.relic.branch = side;
    lv.relic.closed = side === 'left' ? 'right' : 'left';
    lv.relic.pending = false;
    if (side === 'left'){
      if (mod !== 'rich'){
        for (let i = 0; i < RELIC_GEMS; i++){
          const d = BOARD_W * (0.2 + 0.6 * (i / Math.max(1, RELIC_GEMS - 1)));
          const gx = lv.side < 0 ? d : BOARD_W - d;
          lv.gems.push({ d, x: gx, y: railY(lv, d) - COIN_R - 4, taken: false });
        }
      }
      showBanner('遺跡房：寶石區');
    } else {
      coins += RELIC_COINS; stats.coinTotal = safeCount(stats.coinTotal + RELIC_COINS, 0); saveJSON(COINS_KEY, coins);
      if (inv[lv.relic.item] < ITEM_DEFS[lv.relic.item].max) inv[lv.relic.item]++;
      showBanner('遺跡房：金幣＋道具');
    }
  }

  function onArriveSegment(){
    const lv = levels[here];
    run.segments++;
    stats.segments = safeCount(stats.segments + 1, 0);
    if (clock - lastClearSfx >= CLEAR_SFX_GAP){ sfx.clear(); lastClearSfx = clock; }
    lastPowers.push(run.launchPower);
    if (lastPowers.length > 20) lastPowers.shift();
    saveJSON(STATS_KEY, stats);
    discover('terrain', lv.featureType);
    discover('event', lv.event);
    if (lv.mech) discover('mech', lv.mech.type);

    // N6 寶石轉金幣：本段未拾取寶石每顆折算固定金幣
    if (lv.gems && lv.gems.length){
      const left = lv.gems.filter(g => !g.taken).length;
      const val = gemCoinValue();
      if (left > 0 && val > 0){
        const c = left * val;
        coins += c; stats.coinTotal = safeCount(stats.coinTotal + c, 0); saveJSON(COINS_KEY, coins);
      }
    }

    if (!runPaid.has(here)){ runPaid.add(here); awardCoins(lv); }

    // v4 遺跡房岔路：到岔點選擇；自動預設走左（寶石），手動點左右或 ←/→ 選擇後封閉另一側
    if (lv.relic){
      discover('relic', 'room');
      if (!lv.relic.branch){
        if (auto) chooseRelic('left');
        else { lv.relic.pending = true; showBanner('遺跡房：點擊左／右選擇寶石或金幣道具'); }
      }
    }

    if (lv.arena){
      discover('boss', lv.arena.bossType);
      if (!boss || boss.mode !== 'chase'){
        boss = { mode: 'chase', type: lv.arena.bossType, seg: lv.arena.seg, progress: 0, level: Math.max(0, here - 1),
          d: COIN_R, roll: 0, dropping: false, dropT: 0, fromY: 0, toY: 0, x: 0, y: 0, t: 0, rams: 0, close: 0,
          armor: lv.arena.bossType === 'armor' ? ARMOR_COUNT : 0, speedMult: 1, furyT: 0 };
      }
      boss.type = lv.arena.bossType;
      boss.seg = lv.arena.seg;
      boss.progress = 0;
      if (lv.arena.seg === 1){ run.arenaDeath = false; arenaRun.damaged = false; showBanner('BOSS 戰！'); }
      if (lv.arena.exit) startCutscene();
    } else {
      boss = null;
      if (lv.event === 'treasure') showBanner('寶藏層');
      else if (lv.event === 'dark') showBanner('幽暗層');
      else if (lv.event === 'rocks') showBanner('岩陣層');
      else if (lv.event === 'crystal') showBanner('結晶層');
      else if (lv.event === 'echo') showBanner('回聲層');
    }

    // 成就判定
    const wd = lv.world;
    if (wd > stats.deepest){ stats.deepest = wd; saveJSON(STATS_KEY, stats); }
    // v4 排行榜：最深／最速 B20／Rush 連勝
    if (wd > leader.deepest){ leader.deepest = wd; saveLeader(); }
    if (wd >= 20 && (leader.fastestB20 === 0 || b20Time < leader.fastestB20)){ leader.fastestB20 = +b20Time.toFixed(1); saveLeader(); }
    if (gameMode === 'sprint') sprintClock += (lv.arena && lv.arena.exit) ? SPRINT_ARENA_BONUS : SPRINT_SEG_BONUS;
    if (lv.arena && lv.arena.exit && gameMode === 'rush'){
      rushStreak++; rushWonThisRun++;
      if (rushStreak > leader.rushWins){ leader.rushWins = rushStreak; saveLeader(); }
      if (rushStreak > rushBest){ rushBest = rushStreak; saveJSON(RUSH_KEY, rushBest); }
    }
    updateTaskProgress(lv);
    if (wd >= 15) unlock('b15');
    if (wd >= 30) unlock('b30');
    if (run.firstTry){
      run.streak++;
      if (run.streak >= 5) unlock('streak5');
      if (run.launchPower < 0.7) unlock('power70');
    } else run.streak = 0;
    if (lv.selfMin != null && lv.selfMax > lv.selfMin){
      const bandLo = lv.selfMin / 100 + 0.3 * (lv.selfMax - lv.selfMin) / 100;
      const bandHi = lv.selfMax / 100 - 0.3 * (lv.selfMax - lv.selfMin) / 100;
      if (run.launchPower >= bandLo && run.launchPower <= bandHi){
        run.bandStreak++;
        if (run.bandStreak >= 3) unlock('band3');
      } else run.bandStreak = 0;
    } else run.bandStreak = 0;
    if (lv.event === 'echo') unlock('echo');
    if (stats.segments >= 50) unlock('seg50');
    if (stats.segments >= 100) unlock('seg100');
    if (wd >= 40) unlock('b40');
    if (MOD_KEYS.filter(k => k !== 'calm').every(k => codex.has('modifier:' + k))) unlock('modAll');
  }

  function gemBonus(){ return Math.min(gemCapVal(), run.gems * GEM_BONUS_PER); }

  // ================= 主迴圈 =================
  // 任一覆蓋層（選單／圖鑑／統計／成就／說明／教學）開啟時暫停遊戲
  function panelOpen(){
    return !$('overlay').classList.contains('hidden') || !$('tutorial').classList.contains('hidden');
  }

  function update(dt){
    const paused = panelOpen();
    if (charging && !paused) power = Math.min(1, power + dt / CHARGE_TIME * (1 + gemBonus()));
    if (state !== 'over' && !paused) banner.t += dt;
    if (!paused){
      updateParticles(dt);
      if (shake.t < shake.dur) shake.t += dt; else { shake.mag = 0; shake.dur = 0; shake.t = 0; }
    }
    if (!paused){
      if (toastT < 2) toastT += dt;
      if (coinJumpT > 0) coinJumpT -= dt;
      if (shopLockT > 0) shopLockT -= dt;
    }

    if (!paused){
      const cutting = boss && boss.mode === 'cut';
      if (state === 'play' && !cutting){
        const prevHere = here;
        acc += dt * PLAY_SPEED;
        while (acc >= STEP && state === 'play' && !(boss && boss.mode === 'cut')){
          acc -= STEP;
          const wasOnRail = !!coin.onRail;
          const e = simStep(coin, here, STEP, true);
          if (coin.onRail && !wasOnRail && clock - lastLandSfx >= LAND_SFX_GAP){
            sfx.land(); addShake(LAND_SHAKE_MAG, LAND_SHAKE_TIME); lastLandSfx = clock;
          }
          if (e && e.hole){
            if (levels[here] && levels[here].arena) arenaRun.damaged = true;
            const guardLv = upg('guard');
            const guarded = guardLv > 0 && run.segments < guardSegLimit() && run.guardUses < guardUseLimit();
            if (shieldCount > 0){
              // v4 護盾道具：擋一次落穴，回該段槓桿前
              shieldCount--; inv.shield = shieldCount;
              placeAt(here);
              charging = false; chargeSource = null; power = 0; acc = 0;
              spawnParticles(coin.x, coin.y, SPARK_COUNT, col['coin-hi'], 140, 0.5);
              sfx.armorBreak(); toastText = '護盾抵擋落穴'; toastT = 0;
            } else if (guarded){
              // N6 起始保護：回該段槓桿前，不判死
              run.guardUses++;
              placeAt(here);
              charging = false; chargeSource = null; power = 0; acc = 0;
              spawnParticles(coin.x, coin.y, DUST_COUNT, col['coin-hi'], 120, 0.4);
              sfx.ui();
            } else {
              state = 'fall'; fallT = 0; fallHole = e.hole; fallFrom = { x: coin.x, y: coin.y };
              charging = false; chargeSource = null; power = 0;
              run.arenaDeath = !!(levels[here] && levels[here].arena);
              sfx.hole(); addShake(SHAKE_MAX * 0.6, SHAKE_TIME * 0.6);
            }
          }
          for (let k = here + 1; k <= Math.min(levels.length - 1, here + 2); k++){
            if (atLever(k)){ here = k; break; }
          }
        }
        if (here !== prevHere) onArriveSegment();

        if (boss && boss.mode === 'chase'){
          let segTime = SEG_TIME + bossSlowBonus() + (boss.type === 'eye' ? EYE_SEG_TIME_BONUS : 0);
          if (mod === 'swift') segTime -= MOD_SWIFT_SEG_PENALTY;
          segTime = Math.max(4, segTime);
          if (boss.furyT > 0) boss.furyT -= dt;
          else boss.progress = Math.min(1, boss.progress + dt / segTime);
          const maxLv = levels.length - 1;
          boss.level = Math.max(0, here - 1);
          const blv = levels[boss.level];
          const tLeft = Math.max(0.2, segTime * (1 - boss.progress));
          const gapD = blv.gapPos;
          const speed = Math.max(6, Math.min(150, gapD / tLeft)) * boss.speedMult;
          if (!boss.dropping){
            const dir = gapD > boss.d ? 1 : -1;
            boss.d = Math.max(0, Math.min(BOARD_W, boss.d + dir * speed * dt));
            boss.roll += dir * speed * dt / BOSS_R;
            if (boss.progress > 0.8 && Math.abs(boss.d - gapD) < BOSS_R){
              boss.dropping = true; boss.dropT = 0;
              boss.fromY = railY(blv, boss.d);
              const nl = levels[Math.min(maxLv, here)];
              boss.toY = railY(nl, nl.gapPos);
            }
          } else {
            boss.dropT += dt;
            if (boss.dropT >= BOSS_DROP_TIME){
              boss.dropping = false;
              boss.level = Math.min(maxLv, here);
              boss.d = levels[boss.level].gapPos;
            }
          }
          const lv = levels[boss.level];
          const ry = boss.dropping
            ? boss.fromY + (boss.toY - boss.fromY) * Math.min(1, boss.dropT / BOSS_DROP_TIME)
            : railY(lv, boss.d);
          boss.x = lv.side < 0 ? boss.d : BOARD_W - boss.d;
          boss.y = ry - BOSS_R;
          boss.close = Math.max(0, Math.min(1, 1 - Math.hypot(boss.x - coin.x, boss.y - coin.y) / (BOARD_W * 1.6)));
          if (boss.progress >= 1){
            if (levels[here] && levels[here].arena) arenaRun.damaged = true;
            if (boss.type === 'armor' && boss.armor > 0){
              // N1 護甲免死：碎一片、進度重置、速度累積；三片全碎進入狂暴
              arenaRun.damaged = true;
              boss.armor--;
              boss.progress = ARMOR_RESET_PROGRESS;
              boss.speedMult *= ARMOR_SPEED_HIT;
              if (boss.armor === 0){ boss.speedMult = ARMOR_SPEED_FURY; boss.furyT = ARMOR_FURY_TIME; showBanner('護甲碎裂！'); sfx.armorFury(); }
              spawnParticles(boss.x, boss.y, ARMOR_DEBRIS, ARMOR_RING_COLOR, 170, 0.6);
              sfx.armorBreak(); addShake(SHAKE_MAX * 0.5, SHAKE_TIME * 0.5);
            } else if (shieldCount > 0){
              // v4 護盾道具：擋一次追擊，Boss 進度重置
              shieldCount--; inv.shield = shieldCount;
              boss.progress = ARMOR_RESET_PROGRESS;
              spawnParticles(boss.x, boss.y, ARMOR_DEBRIS, ARMOR_RING_COLOR, 170, 0.6);
              sfx.armorBreak(); toastText = '護盾抵擋追擊'; toastT = 0;
            } else {
              boss.x = coin.x; boss.y = coin.y;
              boss.close = 1;
              state = 'fall'; fallT = 0;
              fallHole = { x: coin.x, y: coin.y, r: COIN_R };
              fallFrom = { x: coin.x, y: coin.y };
              charging = false; chargeSource = null; power = 0;
              run.arenaDeath = !!(levels[here] && levels[here].arena);
              spawnParticles(coin.x, coin.y, LUNGE_COUNT, col.rock2, 160, 0.5);
              sfx.chased(); addShake(SHAKE_MAX, SHAKE_TIME);
            }
          }
        }
      }

      if (boss && boss.mode === 'cut'){
        boss.t += dt;
        boss.rams = boss.t >= 1.15 ? 2 : boss.t >= 0.55 ? 1 : 0;
        if (boss.t >= cutFastTime()) endCutscene();
      }

      clock += dt;
      // v4 限時衝刺：倒數歸零結算
      if (gameMode === 'sprint' && state === 'play'){
        sprintClock -= dt;
        if (sprintClock <= 0){
          sprintClock = 0;
          state = 'fall'; fallT = 0;
          fallHole = { x: coin.x, y: coin.y, r: COIN_R }; fallFrom = { x: coin.x, y: coin.y };
          charging = false; chargeSource = null; power = 0;
        }
      }
      if (gameMode !== 'sprint' && state === 'play') b20Time += dt;
      if (state === 'play' && Math.hypot(coin.vx, coin.vy) >= TRAIL_V) trail.push({ x: coin.x, y: coin.y, t: clock });
      while (trail.length > TRAIL_MAX) trail.shift();
      if (state !== 'play') trail = [];
      while (trail.length && clock - trail[0].t > TRAIL_TIME) trail.shift();

      if (state === 'fall'){
        fallT += dt;
        if (fallT >= FALL_TIME) showOver();
      }
      if (state !== 'fall' && state !== 'over'){
        const target = coin.y - viewH() * COIN_SCREEN_Y;
        camY += (target - camY) * Math.min(1, dt * CAM_EASE);
      }
      autoUpdate(dt);
    }
    renderHUD();
  }

  // ================= HUD =================
  let lastShownCoins = -1;
  function renderHUD(){
    const f = floorInfo(here);
    $('floorMain').textContent = f.main;
    $('floorSub').textContent = f.segLabel;
    const coinCap = $('coinCapsule');
    if (lastShownCoins !== coins){
      lastShownCoins = coins;
      $('coinVal').textContent = coins;
      coinCap.classList.remove('jump');
      void coinCap.offsetWidth;
      coinCap.classList.add('jump');
    }
    const dots = $('gemDots');
    dots.innerHTML = '';
    const gemN = Math.min(GEM_PER_LEVEL, run.gems);
    for (let i = 0; i < gemN; i++){
      const el = document.createElement('i');
      el.classList.add('on');
      dots.appendChild(el);
    }
    const mb = $('modBar');
    if (mod !== 'calm'){ mb.classList.remove('hidden'); mb.style.background = MOD_DEFS[mod].dot; }
    else mb.classList.add('hidden');
    const bar = $('bossBar');
    const armorDots = $('armorDots');
    if (boss && boss.mode === 'chase'){
      bar.classList.add('on');
      bar.classList.toggle('eye', boss.type === 'eye');
      const fill = $('bossBarFill');
      fill.style.width = (boss.progress * 100).toFixed(1) + '%';
      fill.classList.toggle('hot', boss.type !== 'eye' && boss.progress > 0.66);
      if (boss.type === 'armor'){
        armorDots.classList.remove('hidden');
        armorDots.innerHTML = '';
        for (let i = 0; i < ARMOR_COUNT; i++){
          const el = document.createElement('i');
          if (i >= boss.armor) el.classList.add('off');
          armorDots.appendChild(el);
        }
      } else armorDots.classList.add('hidden');
    } else { bar.classList.remove('on'); armorDots.classList.add('hidden'); }
    // v4 道具第二排：持有 >0 才出現，全 0 隱藏
    const ib = $('itemBar');
    const anyItem = inv.shield > 0 || inv.drill > 0 || inv.magnet > 0;
    ib.classList.toggle('hidden', !anyItem);
    if (anyItem){
      ib.innerHTML = '';
      const labels = { shield: ['盾', '1'], drill: ['鑽', '2'], magnet: ['磁', '3'] };
      for (const id of ['shield', 'drill', 'magnet']){
        if (inv[id] <= 0) continue;
        const chip = document.createElement('div');
        chip.className = 'itemChip';
        chip.dataset.item = id;
        chip.innerHTML = `<span class="ic">${labels[id][0]}</span><span class="n">${inv[id]}</span>`;
        chip.addEventListener('pointerdown', e => e.stopPropagation());
        chip.addEventListener('click', () => useItem(id));
        ib.appendChild(chip);
      }
    }
  }

  // M1 軌跡預覽：Lv0 完全不顯示；Lv≥1 且設定開關開才顯示
  function computePreview(){
    if (!charging || auto || !settings.preview || !previewUnlocked() || state !== 'play') return [];
    const r = levels[here].rest;
    const c = { x: r.x, y: r.y, vx: 0, vy: 0, still: 0, springUsed: false };
    launch(c, here, power);
    const pts = [];
    const ptsN = previewPointCount();
    const stepN = Math.max(1, Math.round(PREVIEW_TIME / STEP / ptsN));
    let n = 0;
    const total = Math.round(PREVIEW_TIME / STEP);
    for (let i = 0; i < total; i++){
      const e = simStep(c, here, STEP, false);
      if (i % stepN === 0) pts.push({ x: c.x, y: c.y });
      if (e && (e.hole || e.rest != null || e.stuck)) break;
      n++;
    }
    return pts.slice(0, ptsN);
  }

  // ================= 描画 =================
  const viewH = () => H / SC;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SC = W / (BOARD_W + (WALL + LEVER_AREA) * 2);
    if (coin) camY = coin.y - viewH() * COIN_SCREEN_Y;   // 重算縮放後重新錨定相機
    if (sideFrame) buildSideFrame();                    // B11：旋轉／縮放後重建框景，不留舊 buffer
  }

  // V4 寬螢幕兩側岩壁框景：離屏預渲染一次，不進物理／相機
  let sideFrame = null;
  function buildSideFrame(){
    const fw = 1280, fh = 800;
    sideFrame = document.createElement('canvas');
    sideFrame.width = fw; sideFrame.height = fh;
    const s = sideFrame.getContext('2d');
    const g = s.createLinearGradient(0, 0, 0, fh);
    g.addColorStop(0, col.rock4); g.addColorStop(0.5, col.rock3); g.addColorStop(1, col.rock4);
    s.fillStyle = g; s.fillRect(0, 0, fw, fh);
    // 極低對比淡斑：alpha 與尺寸再降一半，讀成背景而非第二個場景
    for (let i = 0; i < 120; i++){
      const x = hash(i, 3, 1) * fw, y = hash(i, 5, 2) * fh, r = 3 + hash(i, 7, 3) * 9;
      s.fillStyle = 'rgba(0,0,0,' + (0.025 + hash(i, 9, 4) * 0.03) + ')';
      s.beginPath(); s.arc(x, y, r, 0, Math.PI * 2); s.fill();
    }
    // 由外向內暗角（vignette），中央板帶區域維持透明
    const L = (fw - 420) / 2, R = (fw + 420) / 2;
    const vg = s.createLinearGradient(0, 0, fw, 0);
    vg.addColorStop(0, 'rgba(0,0,0,.5)');
    vg.addColorStop(L / fw, 'rgba(0,0,0,0)');
    vg.addColorStop(R / fw, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.5)');
    s.fillStyle = vg; s.fillRect(0, 0, fw, fh);
    // 遊戲欄位左右 1px 極淡邊線＋輕微內陰影
    s.fillStyle = 'rgba(0,0,0,.5)';
    s.fillRect(L - 1, 0, 1, fh);
    s.fillRect(R, 0, 1, fh);
    s.fillStyle = 'rgba(255,240,205,.06)';
    s.fillRect(L, 0, 1, fh);
    s.fillRect(R + 1, 0, 1, fh);
    document.body.style.backgroundImage = 'url(' + sideFrame.toDataURL() + ')';
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center center';
  }

  const rgb = hex => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const mix = (a, b, t) => 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',') + ')';
  const ROCK_STOPS = [[0, rgb(col.rock0)], [80, rgb(col.rock1)], [250, rgb(col.rock2)], [600, rgb(col.rock3)], [1200, rgb(col.rock4)]];
  function rockColor(m){
    for (let i = 1; i < ROCK_STOPS.length; i++){
      const [m1, c1] = ROCK_STOPS[i], [m0, c0] = ROCK_STOPS[i - 1];
      if (m <= m1) return mix(c0, c1, (m - m0) / (m1 - m0));
    }
    return mix(ROCK_STOPS[ROCK_STOPS.length - 1][1], ROCK_STOPS[ROCK_STOPS.length - 1][1], 0);
  }
  const rockRGBA = (m, a) => rockColor(m).replace('rgb(', 'rgba(').replace(')', ',' + a + ')');
  function hash(i, j, k){
    let h = (i * 374761393 + j * 668265263 + k * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  const CELL = 44;
  const SURFACE_Y = -150;
  const GRASS_H = 26;
  const DARK_MAX = 0.82;
  const DARK_DEPTH = 450;
  const LIGHT_IN = 110;
  const LIGHT_OUT = 340;

  function drawSurface(top){
    const x0 = -WALL - LEVER_AREA, x1 = BOARD_W + WALL + LEVER_AREA, w = x1 - x0;
    const ground = SURFACE_Y - GRASS_H;
    const sky = ctx.createLinearGradient(0, ground - 360, 0, ground);
    sky.addColorStop(0, col.sky); sky.addColorStop(1, col['sky-low']);
    ctx.fillStyle = sky;
    ctx.fillRect(x0, top, w, SURFACE_Y - top);
    ctx.fillStyle = col.hill;
    ctx.beginPath();
    ctx.moveTo(x0, ground + 2);
    for (let x = x0; x <= x1; x += 8){
      const y = ground - 22 - 16 * Math.sin((x + 40) / 70) - 10 * Math.sin((x + 5) / 31);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(x1, ground + 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = col.grass;
    ctx.fillRect(x0, ground, w, GRASS_H);
    ctx.strokeStyle = col['grass-dark'];
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i * 5 < w; i++){
      const x = x0 + i * 5 + hash(i, 7, 1) * 4;
      const hgt = 4 + hash(i, 7, 2) * 7, lean = (hash(i, 7, 3) - 0.5) * 5;
      ctx.moveTo(x, ground + 1); ctx.lineTo(x + lean, ground - hgt);
    }
    for (let i = 0; i * 9 < w; i++){
      const x = x0 + i * 9 + hash(i, 8, 1) * 8, y = ground + 6 + hash(i, 8, 2) * (GRASS_H - 10);
      ctx.moveTo(x, y); ctx.lineTo(x + (hash(i, 8, 3) - 0.5) * 3, y - 3 - hash(i, 8, 4) * 3);
    }
    ctx.stroke();
    ctx.fillStyle = col.soil;
    ctx.fillRect(x0, SURFACE_Y - 5, w, 5);
  }

  function drawRock(x0, x1, top, bottom, darker){
    const step = 30;
    for (let y = Math.floor(top / step) * step; y < bottom; y += step){
      ctx.fillStyle = rockColor(depthM(y));
      ctx.fillRect(x0, y, x1 - x0, step + 1);
    }
    for (let j = Math.floor(top / CELL); j * CELL < bottom; j++){
      for (let i = Math.floor(x0 / CELL); i * CELL < x1; i++){
        for (let n = 0; n < 2; n++){
          const hx = hash(i, j, n * 3 + 1), hy = hash(i, j, n * 3 + 2), hs = hash(i, j, n * 3 + 3);
          const cx = (i + hx) * CELL, cy = (j + hy) * CELL;
          if (cx < x0 - 10 || cx > x1 + 10) continue;
          ctx.fillStyle = hs < 0.5 ? 'rgba(0,0,0,' + (darker ? 0.26 : 0.12) + ')' : 'rgba(255,240,220,0.04)';
          ctx.beginPath();
          ctx.ellipse(cx, cy, 5 + hs * 12, 3 + hs * 7, hx * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }
        const m = depthM(j * CELL);
        if (!darker && m > 120 && hash(i, j, 9) < Math.min(0.12, (m - 120) / 2000)){
          const cx = (i + hash(i, j, 10)) * CELL, cy = (j + hash(i, j, 11)) * CELL;
          ctx.fillStyle = hash(i, j, 12) < 0.5 ? col.crystal : col.crystal2;
          ctx.globalAlpha = 0.55;
          for (let q = 0; q < 3; q++){
            const a = -Math.PI / 2 + (q - 1) * 0.45, l = 8 + q % 2 * 5;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a) * l, cy + Math.sin(a) * l);
            ctx.lineTo(cx + Math.cos(a + 1.6) * 2.5, cy + Math.sin(a + 1.6) * 2.5);
            ctx.lineTo(cx + Math.cos(a - 1.6) * 2.5, cy + Math.sin(a - 1.6) * 2.5);
            ctx.closePath(); ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  function drawTrail(){
    const pts = [];
    for (const p of [...trail, { x: coin.x, y: coin.y, t: clock }]){
      const q = pts[pts.length - 1];
      if (!q || Math.hypot(p.x - q.x, p.y - q.y) > 1) pts.push(p);
    }
    if (pts.length < 2) return;
    const L = [], R = [];
    for (let i = 0; i < pts.length; i++){
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1;
      const f = Math.max(0, 1 - (clock - pts[i].t) / TRAIL_TIME);
      const w = COIN_R * (0.2 + 0.75 * f);
      L.push([pts[i].x - dy / l * w, pts[i].y + dx / l * w]);
      R.push([pts[i].x + dy / l * w, pts[i].y - dx / l * w]);
    }
    const t0 = pts[0], t1 = pts[pts.length - 1];
    const g = ctx.createLinearGradient(t0.x, t0.y, t1.x, t1.y);
    g.addColorStop(0, rgbaOf(col['coin-hi'], 0));
    g.addColorStop(1, rgbaOf(col['coin-hi'], TRAIL_ALPHA));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(L[0][0], L[0][1]);
    for (let i = 1; i < L.length; i++) ctx.lineTo(L[i][0], L[i][1]);
    for (let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
    ctx.closePath(); ctx.fill();
  }
  const rgbaOf = (hex, a) => 'rgba(' + rgb(hex).join(',') + ',' + a + ')';

  function roundRectPath(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // v3 銘牌：貼拉桿同側岩壁、拉桿下緣外側；文字走 floorInfo()，只畫可見段
  function drawPlaque(lv, i){
    const py = lv.rest.y;
    // 左右鏡像：外牆內縮 1 單位，牌子落在牆條內、不被畫布邊界裁掉
    const x0 = lv.side < 0 ? -WALL - LEVER_AREA + 1 : BOARD_W + WALL + 1;
    const y0 = py + PLAQUE_OFFSET_Y;
    const w = PLAQUE_W, h = PLAQUE_H, r = PLAQUE_R;
    // 1) 底座投影（與岩壁協調的柔影，避免硬黑方塊）
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.28)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetY = 2;
    // 2) 陳年黃銅／青銅漸層（5 段，明度明顯低於金幣）
    const g = ctx.createLinearGradient(x0, y0, x0 + w, y0 + h);
    g.addColorStop(0, '#c8a24a');
    g.addColorStop(0.25, '#a8863a');
    g.addColorStop(0.5, '#9a7a2e');
    g.addColorStop(0.75, '#755922');
    g.addColorStop(1, '#5c451a');
    roundRectPath(x0, y0, w, h, r);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
    // 外暗描邊：讓牌子從岩壁立起來
    roundRectPath(x0 + 0.5, y0 + 0.5, w - 1, h - 1, r);
    ctx.strokeStyle = 'rgba(30,20,8,0.7)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 3) 加厚倒角：上/左 1.5px 亮邊，下/右 1.5px 暗邊
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(255,240,205,0.55)';
    ctx.beginPath();
    ctx.moveTo(x0 + r, y0 + 0.75); ctx.lineTo(x0 + w - r, y0 + 0.75);
    ctx.moveTo(x0 + 0.75, y0 + r); ctx.lineTo(x0 + 0.75, y0 + h - r);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(50,34,10,0.65)';
    ctx.beginPath();
    ctx.moveTo(x0 + r, y0 + h - 0.75); ctx.lineTo(x0 + w - r, y0 + h - 0.75);
    ctx.moveTo(x0 + w - 0.75, y0 + r); ctx.lineTo(x0 + w - 0.75, y0 + h - r);
    ctx.stroke();
    // 4) 內凹：頂部內陰影（高 3 單位向下漸淡）+ 內側暗線
    ctx.save();
    roundRectPath(x0 + 1.5, y0 + 1.5, w - 3, h - 3, Math.max(1, r - 1));
    ctx.clip();
    const ish = ctx.createLinearGradient(0, y0, 0, y0 + 3);
    ish.addColorStop(0, 'rgba(0,0,0,0.35)');
    ish.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ish;
    ctx.fillRect(x0 + 1.5, y0, w - 3, 3);
    ctx.restore();
    roundRectPath(x0 + 1.5, y0 + 1.5, w - 3, h - 3, Math.max(1, r - 1));
    ctx.strokeStyle = 'rgba(40,26,8,0.45)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 5) 青銅鏽斑：偏綠，hash 固定，≤6，alpha ≤0.10
    for (let n = 0; n < PLAQUE_WEAR; n++){
      const hx = hash(i, n, 11), hy = hash(i, n, 12), hs = hash(i, n, 13);
      ctx.fillStyle = 'rgba(90,115,80,' + (0.05 + hs * 0.05).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(x0 + 4 + hx * (w - 8), y0 + 4 + hy * (h - 8), 1.2 + hs * 1.6, 0.8 + hs, hx * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
    // 6) 四角鉚釘（帶高光）
    const rivets = [[x0 + 3, y0 + 3], [x0 + w - 3, y0 + 3], [x0 + 3, y0 + h - 3], [x0 + w - 3, y0 + h - 3]];
    for (const [rx, ry] of rivets){
      ctx.beginPath(); ctx.arc(rx, ry, 1.2, 0, Math.PI * 2);
      ctx.fillStyle = '#5c451a'; ctx.fill();
      ctx.beginPath(); ctx.arc(rx - 0.3, ry - 0.3, 0.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,240,205,0.55)'; ctx.fill();
    }
    // 7) 陰刻字：壓暗填字 + 右下 1 單位低 alpha 亮邊，字距 +0.5
    const f = floorInfo(i);
    const label = f.main;  // R4：銘牌與 HUD 同源，僅顯示 B#，不再並列 floorNo-seg 舊口徑
    ctx.font = 'bold ' + PLAQUE_FONT + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    try { ctx.letterSpacing = '0.5px'; } catch(e){}
    ctx.fillStyle = '#2a1e06';
    ctx.fillText(label, x0 + w / 2, y0 + h / 2);
    ctx.fillStyle = 'rgba(255,240,205,0.28)';
    ctx.fillText(label, x0 + w / 2 + 1, y0 + h / 2 + 1);
    try { ctx.letterSpacing = '0px'; } catch(e){}
  }

  function drawLever(lv, pull){    const wx = lv.side < 0 ? -WALL : BOARD_W + WALL;
    const py = lv.rest.y;
    const ang = (20 + pull * 40) * Math.PI / 180;
    const len = LEVER_AREA - LEVER_KNOB_R - 2;
    const ex = wx + lv.side * Math.sin(ang) * len;
    const ey = py - Math.cos(ang) * len;
    ctx.fillStyle = col['lever-line'];
    ctx.fillRect(wx - 5, py - 7, 10, 14);
    ctx.strokeStyle = col['lever-line'];
    ctx.lineCap = 'round';
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(wx, py); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.arc(ex, ey, LEVER_KNOB_R, 0, Math.PI * 2);
    ctx.fillStyle = col.lever; ctx.fill();
    ctx.lineWidth = 2; ctx.stroke();
  }

  function drawExitDoor(lv){
    const x0 = lv.side < 0 ? -WALL : BOARD_W;
    const h = 66, cy = lv.rest.y - h * 0.4;
    const g = ctx.createLinearGradient(x0, 0, x0 + WALL, 0);
    g.addColorStop(0, 'rgba(255,236,186,0.30)');
    g.addColorStop(1, 'rgba(255,236,186,0.06)');
    ctx.fillStyle = g;
    ctx.fillRect(x0, cy, WALL, h);
    ctx.fillStyle = 'rgba(38,30,26,0.85)';
    ctx.fillRect(x0 + (lv.side < 0 ? 3 : -3), cy + 4, WALL - 6, h - 8);
    ctx.strokeStyle = col['accent-exit'];
    ctx.lineWidth = 2;
    ctx.strokeRect(x0 + 1.5, cy + 1.5, WALL - 3, h - 3);
    ctx.fillStyle = 'rgba(255,240,200,0.55)';
    ctx.fillRect(x0 + (lv.side < 0 ? WALL - 3 : 0), cy + 6, 3, h - 12);
  }

  function drawPlank(sg, alpha){
    const p = sg.a.x <= sg.b.x ? sg.a : sg.b, q = p === sg.a ? sg.b : sg.a;
    const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy);
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.atan2(dy, dx));
    ctx.fillStyle = col['plank-dark'];
    ctx.fillRect(0, -1, len, 11);
    ctx.fillStyle = col.plank;
    ctx.fillRect(0, 0, len, 8);
    ctx.fillStyle = 'rgba(255,230,190,0.18)';
    ctx.fillRect(0, 0, len, 1.5);
    ctx.fillStyle = col.nail;
    for (let d = 10; d < len - 4; d += 38){
      ctx.beginPath(); ctx.arc(d, 4, 1.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawRockFace(x, y, r, tint, noStem){
    if (!noStem){
      ctx.fillStyle = col['wall-edge'];
      ctx.beginPath();
      ctx.moveTo(x - r * 0.55, y - r * 0.4);
      ctx.lineTo(x - r * 0.2, y - r - ROCK_STEM);
      ctx.lineTo(x + r * 0.2, y - r - ROCK_STEM);
      ctx.lineTo(x + r * 0.55, y - r * 0.4);
      ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = tint || col.rock1; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = col['wall-edge']; ctx.stroke();
    ctx.fillStyle = 'rgba(255,240,220,0.12)';
    ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.25, r * 0.4, 0, Math.PI * 2); ctx.fill();
    const ey = y - r * 0.08, ex = r * 0.32;
    ctx.strokeStyle = col.hole; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - ex - r * 0.18, ey - r * 0.32); ctx.lineTo(x - ex + r * 0.14, ey - r * 0.14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + ex + r * 0.18, ey - r * 0.32); ctx.lineTo(x + ex - r * 0.14, ey - r * 0.14); ctx.stroke();
    for (const s of [-1, 1]){
      ctx.beginPath(); ctx.arc(x + s * ex, ey, r * 0.17, 0, Math.PI * 2);
      ctx.fillStyle = col.fg; ctx.fill();
      ctx.beginPath(); ctx.arc(x + s * ex + s * 2, ey + 1, r * 0.08, 0, Math.PI * 2);
      ctx.fillStyle = col.hole; ctx.fill();
    }
  }

  // 晶眼 Boss：結晶飛眼，獨立繪製
  function drawEyeFace(x, y, r){
    const bob = Math.sin(clock * 4) * 2;
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.9, r * 0.78, 0, 0, Math.PI * 2);
    ctx.fillStyle = col['accent-crystal']; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = col.crystal2; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.5, r * 0.42, 0, 0, Math.PI * 2);
    ctx.fillStyle = col.hole; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = col.fg; ctx.fill();
    // 結晶尖刺
    ctx.fillStyle = col.crystal2;
    for (const s of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(s * r * 0.7, -r * 0.3);
      ctx.lineTo(s * r * 1.15, -r * 0.7);
      ctx.lineTo(s * r * 0.95, 0);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawChaseBoss(){
    if (!boss || boss.mode !== 'chase') return;
    const p = boss.close == null ? boss.progress : boss.close, r = BOSS_R;
    const shakeAmt = p > 0.6 ? Math.sin(clock * 30) * (p - 0.6) * 6 : 0;
    const x = boss.x + shakeAmt, y = boss.y;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(x, y + r * 0.94, r * 0.9, r * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    if (boss.type === 'eye'){
      drawEyeFace(x, y, r);
    } else if (boss.type === 'armor'){
      const fury = boss.armor === 0;
      ctx.save(); ctx.translate(x, y);
      drawRockFace(0, 0, r, fury ? 'rgb(140,64,52)' : col.rock1, true);
      ctx.restore();
      // 三片護甲弧：碎一片熄一顆，不留殘影
      const armorGrad = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
      armorGrad.addColorStop(0, '#8a6a3a');
      armorGrad.addColorStop(1, '#c9a24a');
      for (let i = 0; i < ARMOR_COUNT; i++){
        const a0 = -Math.PI / 2 + i * (Math.PI * 2 / ARMOR_COUNT) + 0.12;
        const a1 = a0 + Math.PI * 2 / ARMOR_COUNT - 0.24;
        ctx.save();
        if (i < boss.armor){
          ctx.shadowColor = 'rgba(201,162,74,.15)';
          ctx.shadowBlur = 4;
          ctx.strokeStyle = armorGrad;
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(x, y, r + 4, a0, a1); ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255,240,205,.35)';
          ctx.lineWidth = 0.5;
          ctx.beginPath(); ctx.arc(x, y, r + 5.5, a0, a1); ctx.stroke();
        } else {
          ctx.strokeStyle = 'rgba(241,230,210,.18)';
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(x, y, r + 4, a0, a1); ctx.stroke();
        }
        ctx.restore();
      }
    } else {
      const tint = p > 0.66 ? 'rgb(120,70,60)' : col.rock1;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(boss.roll);
      drawRockFace(0, 0, r, tint, true);
      ctx.restore();
    }
  }

  function drawCutBoss(){
    if (!boss || boss.mode !== 'cut') return;
    const r = BOSS_R;
    const dash = Math.min(1, boss.t / 0.4);
    const fromX = boss.sx != null ? boss.sx : boss.x;
    let x = fromX + (boss.doorX - fromX) * dash;
    if (boss.rams > 0){
      const phase = boss.rams === 1 ? boss.t - 0.55 : boss.t - 1.15;
      if (phase >= 0 && phase < 0.18) x += Math.sin(phase * 60) * 5 * (1 - phase / 0.18);
    }
    if (boss.t > 1.4) x += (boss.t - 1.4) * 120 * Math.sign(boss.doorX - fromX || 1);
    const roll = boss.t < 0.4 ? boss.t / 0.4 * Math.PI * 3 : Math.PI * 3;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(x, boss.y + r * 0.94, r * 0.9, r * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    if (boss.type === 'eye') drawEyeFace(x, boss.y, r);
    else {
      ctx.save(); ctx.translate(x, boss.y); ctx.rotate(roll);
      drawRockFace(0, 0, r, col.rock1, true);
      ctx.restore();
    }
  }

  function drawRockBump(rk){
    ctx.fillStyle = col['wall-edge'];
    ctx.beginPath();
    ctx.moveTo(rk.x - rk.r * 0.9, rk.y - rk.r * 0.3);
    ctx.lineTo(rk.x - rk.r * 0.35, rk.y - rk.r - ROCK_STEM);
    ctx.lineTo(rk.x + rk.r * 0.35, rk.y - rk.r - ROCK_STEM);
    ctx.lineTo(rk.x + rk.r * 0.9, rk.y - rk.r * 0.3);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(rk.x, rk.y, rk.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,220,0.15)';
    ctx.beginPath(); ctx.arc(rk.x - rk.r * 0.3, rk.y - rk.r * 0.2, rk.r * 0.45, 0, Math.PI * 2); ctx.fill();
  }

  function drawBreakRock(rk){
    drawRockBump(rk);
    ctx.strokeStyle = 'rgba(20,14,8,.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(rk.x - rk.r * 0.5, rk.y - rk.r * 0.3); ctx.lineTo(rk.x, rk.y); ctx.lineTo(rk.x + rk.r * 0.4, rk.y + rk.r * 0.4);
    ctx.moveTo(rk.x, rk.y); ctx.lineTo(rk.x - rk.r * 0.2, rk.y + rk.r * 0.5);
    ctx.stroke();
  }

  function drawMech(lv){
    const mx = d => lv.side < 0 ? d : BOARD_W - d;
    const m = lv.mech;
    if (m.type === 'ice'){
      ctx.save(); ctx.globalAlpha = 0.22; ctx.strokeStyle = '#9fd8e8'; ctx.lineWidth = 2;
      for (const sg of lv.segs){ ctx.beginPath(); ctx.moveTo(sg.a.x, sg.a.y - 1); ctx.lineTo(sg.b.x, sg.b.y - 1); ctx.stroke(); }
      ctx.restore();
    } else if (m.type === 'wind'){
      const x0 = mx(m.d0), x1 = mx(m.d1), y = railY(lv, (m.d0 + m.d1) / 2) - 14;
      ctx.save(); ctx.strokeStyle = 'rgba(180,210,230,.35)'; ctx.lineWidth = 1.2;
      for (let i = 0; i < 3; i++){
        const yy = y + i * 7 + Math.sin(clock * 6 + i) * 2;
        ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x1, yy); ctx.stroke();
      }
      ctx.restore();
    } else if (m.type === 'pad'){
      const x0 = mx(m.d0), x1 = mx(m.d1), y = railY(lv, (m.d0 + m.d1) / 2) + 14;
      ctx.fillStyle = m.used ? 'rgba(120,90,50,.4)' : col['lever-line'];
      ctx.fillRect(x0, y, x1 - x0, 5);
    } else if (m.type === 'mover'){
      const mid = (m.d0 + m.d1) / 2;
      const off = MECH_MOVER_AMP * Math.sin(2 * Math.PI * m.t / MECH_MOVER_PERIOD + m.phase);
      const pd = Math.max(m.d0, Math.min(m.d1, mid + off));
      const px = mx(pd), py = railY(lv, pd) - 4;
      ctx.fillStyle = 'rgba(150,110,60,.85)';
      ctx.fillRect(px - MECH_MOVER_HALF, py, MECH_MOVER_HALF * 2, 6);
      ctx.strokeStyle = 'rgba(50,34,10,.6)'; ctx.lineWidth = 1;
      ctx.strokeRect(px - MECH_MOVER_HALF, py, MECH_MOVER_HALF * 2, 6);
    } else if (m.type === 'portal'){
      const pa = { x: mx(m.a), y: railY(lv, m.a) - COIN_R - 2 };
      const pb = { x: mx(m.b), y: railY(lv, m.b) - COIN_R - 2 };
      const fade = m.cd > 0 ? Math.max(0.25, m.cd / MECH_PORTAL_FADE) : 1;
      ctx.save(); ctx.globalAlpha = fade;
      ctx.strokeStyle = '#78b4ff'; ctx.lineWidth = 1.6;
      for (const p of [pa, pb]){
        ctx.beginPath(); ctx.arc(p.x, p.y, MECH_PORTAL_R, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(p.x, p.y, MECH_PORTAL_R * 0.55, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    } else if (m.type === 'rotor'){
      const pivot = { x: mx(m.d), y: railY(lv, m.d) - 10 };
      const ang = 2 * Math.PI * m.t / MECH_ROTOR_PERIOD + m.phase;
      const ex = pivot.x + MECH_ROTOR_ARM * Math.cos(ang);
      const ey = pivot.y + MECH_ROTOR_ARM * Math.sin(ang);
      ctx.strokeStyle = 'rgba(180,140,80,.85)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(pivot.x, pivot.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.fillStyle = '#c9a24a';
      ctx.beginPath(); ctx.arc(ex, ey, MECH_ROTOR_R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(50,34,10,.7)';
      ctx.beginPath(); ctx.arc(pivot.x, pivot.y, 3, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawHole(ho){
    const g = ctx.createRadialGradient(ho.x, ho.y + ho.r * 0.2, ho.r * 0.2, ho.x, ho.y, ho.r);
    g.addColorStop(0, col.hole);
    g.addColorStop(0.75, col.hole);
    g.addColorStop(1, col['hole-rim']);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ho.x, ho.y, ho.r, 0, Math.PI * 2); ctx.fill();
  }

  const SINK_EDGE = 0.45;
  const FALL_DROP = 0.3;
  function fallPose(){
    const t = Math.min(1, fallT / FALL_TIME);
    const x = fallFrom.x;
    const above = fallFrom.y < fallHole.y - 2;
    if (above && t < FALL_DROP){
      const k = t / FALL_DROP;
      return { x, y: fallFrom.y + (fallHole.y - fallFrom.y) * k * k, r: COIN_R, sink: false };
    }
    const y0 = above ? fallHole.y : fallFrom.y;
    const k = above ? (t - FALL_DROP) / (1 - FALL_DROP) : t;
    return {
      x: x + (fallHole.x - x) * Math.min(1, k * 2), y0, k,
      y: y0 + (fallHole.y + fallHole.r + COIN_R - y0) * k * k,
      r: COIN_R * (1 - 0.2 * k), shade: 0.75 * k, sink: true
    };
  }

  function drawCoin(px, py, r){
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fillStyle = col.coin; ctx.fill();
    ctx.lineWidth = 1.6; ctx.strokeStyle = col['coin-line']; ctx.stroke();
    ctx.beginPath(); ctx.arc(px, py, r * 0.72, 0, Math.PI * 2);
    ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = col['coin-hi'];
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(px - r * 0.38, py - r * 0.38, r * 0.24, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function lightScale(){
    const lv = levels[here];
    if (!lv) return 1;
    let s = 1;
    if (lv.event === 'dark') s = 0.55 * lightBonus();
    else if (lv.event === 'echo') s = ECHO_LIGHT_MULT;
    if (mod === 'dim') s *= MOD_DIM_LIGHT;
    return s;
  }

  function draw(){
    ctx.fillStyle = col.bg;
    ctx.fillRect(0, 0, W, H);
    const vh = viewH();

    let shx = 0, shy = 0;
    if (shake.t < shake.dur && shake.dur > 0){
      const k = 1 - shake.t / shake.dur;
      shx = rand(-shake.mag, shake.mag) * k;
      shy = rand(-shake.mag, shake.mag) * k;
    }

    ctx.save();
    ctx.scale(SC, SC);
    ctx.translate(WALL + LEVER_AREA + shx, -camY + shy);
    const top = camY - 80, bottom = camY + vh + 80;

    drawRock(0, BOARD_W, top, bottom, false);
    if (top < SURFACE_Y) drawSurface(top);
    const wt = Math.max(top, SURFACE_Y);
    if (wt < bottom){
      drawRock(-WALL - LEVER_AREA, -WALL, wt, bottom, true);
      drawRock(BOARD_W + WALL, BOARD_W + WALL + LEVER_AREA, wt, bottom, true);
      ctx.fillStyle = col.wall;
      ctx.fillRect(-WALL, wt, WALL, bottom - wt);
      ctx.fillRect(BOARD_W, wt, WALL, bottom - wt);
      ctx.fillStyle = col['wall-edge'];
      ctx.fillRect(-1.5, wt, 1.5, bottom - wt);
      ctx.fillRect(BOARD_W, wt, 1.5, bottom - wt);
    }

    const visible = levels.filter(lv => !(lv.a.y < top - 100 || lv.topY > bottom + 100));
    for (const lv of visible) for (const ho of lv.holes) drawHole(ho);

    const pose = state === 'fall' ? fallPose() : null;
    if (pose && pose.sink){
      ctx.save();
      ctx.beginPath();
      ctx.arc(fallHole.x, fallHole.y, fallHole.r, 0, Math.PI * 2);
      const rim = (COIN_R + 1) * Math.max(0, 1 - pose.k / SINK_EDGE);
      if (rim > 0){ ctx.moveTo(pose.x + rim, pose.y0); ctx.arc(pose.x, pose.y0, rim, 0, Math.PI * 2); }
      ctx.clip();
      drawCoin(pose.x, pose.y, pose.r);
      ctx.globalAlpha = pose.shade;
      ctx.beginPath(); ctx.arc(pose.x, pose.y, pose.r + 1, 0, Math.PI * 2);
      ctx.fillStyle = col.hole; ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    for (let i = 0; i < levels.length; i++){
      const lv = levels[i];
      if (lv.a.y < top - 100 || lv.topY > bottom + 100) continue;
      const exitAlpha = lv.arena && lv.arena.exit ? 0.32 : 1;
      for (const sg of lv.segs) drawPlank(sg, exitAlpha);
      if (lv.arena && lv.arena.exit){
        drawExitDoor(lv);
        ctx.save();
        ctx.strokeStyle = 'rgba(255,240,205,0.5)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(lv.segs[0].a.x, lv.segs[0].a.y - 1);
        for (const sg of lv.segs) ctx.lineTo(sg.b.x, sg.b.y - 1);
        ctx.stroke();
        ctx.restore();
      }
      for (const rk of lv.rocks){ if (rk.breakable) drawBreakRock(rk); else drawRockBump(rk); }
      // v4 機關視覺
      if (lv.mech) drawMech(lv);
      // v4 岔路封閉側：一條淡封印短槓，標示另一側已關閉
      if (lv.relic && lv.relic.closed){
        const cy = railY(lv, BOARD_W / 2) - 12;
        const cx = lv.relic.closed === 'left' ? WALL + 24 : BOARD_W - WALL - 24;
        ctx.strokeStyle = 'rgba(60,40,16,.35)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + 10, cy); ctx.stroke();
      }
      // 彈簧台視覺
      if (lv.spring){
        const x0 = lv.side < 0 ? lv.spring.d0 : BOARD_W - lv.spring.d1;
        const x1 = lv.side < 0 ? lv.spring.d1 : BOARD_W - lv.spring.d0;
        const y0 = railY(lv, (lv.spring.d0 + lv.spring.d1) / 2);
        ctx.fillStyle = col['lever-line'];
        ctx.fillRect(x0, y0 - 6, x1 - x0, 6);
        ctx.strokeStyle = col.lever;
        ctx.lineWidth = 1.4;
        for (let sx = x0 + 3; sx < x1 - 3; sx += 5){
          ctx.beginPath(); ctx.moveTo(sx, y0 - 6); ctx.lineTo(sx + 2, y0 - 1); ctx.stroke();
        }
      }
      // 寶石
      for (const g of lv.gems){
        if (g.taken) continue;
        const tw = 0.6 + 0.4 * Math.sin(clock * 5 + g.d);
        ctx.save();
        ctx.globalAlpha = tw;
        ctx.fillStyle = col['coin-hi'];
        ctx.beginPath();
        ctx.moveTo(g.x, g.y - 5); ctx.lineTo(g.x + 4, g.y); ctx.lineTo(g.x, g.y + 5); ctx.lineTo(g.x - 4, g.y);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      // 結晶層金貨微光
      if (lv.event === 'crystal' && i === here){
        const g = ctx.createRadialGradient(coin.x, coin.y, 2, coin.x, coin.y, COIN_R * 2.4);
        g.addColorStop(0, rgbaOf(col.crystal, 0.35));
        g.addColorStop(1, rgbaOf(col.crystal, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(coin.x, coin.y, COIN_R * 2.4, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = col.plank;
      for (let j = 1; j < lv.segs.length; j++){
        const p0 = lv.segs[j - 1].b, p1 = lv.segs[j].a;
        if (Math.abs(p0.x - p1.x) < 0.5 && Math.abs(p0.y - p1.y) < 0.5){
          ctx.beginPath(); ctx.arc(p0.x, p0.y + 4, 4.2, 0, Math.PI * 2); ctx.fill();
        }
      }
      drawLever(lv, i === here && charging ? power : 0);
      drawPlaque(lv, i);
      // 首局引導：首次發射前拉桿脈動箭頭（無文字，發射後永久消失）
      if (i === here && !run.firstLaunch && !firstLaunchDone && state === 'play' && !charging){
        const wx = lv.side < 0 ? -WALL : BOARD_W + WALL;
        const ang = 20 * Math.PI / 180;
        const len = LEVER_AREA - LEVER_KNOB_R - 2;
        const ex = wx + lv.side * Math.sin(ang) * len;
        const ey = lv.rest.y - Math.cos(ang) * len;
        const dx = lv.side * Math.sin(ang), dy = -Math.cos(ang);
        const px = -dy, py = dx;
        const cx = ex + dx * 13, cy = ey + dy * 13;
        const tipx = ex + dx * 6, tipy = ey + dy * 6;
        const pulse = 0.55 + 0.3 * Math.sin(performance.now() / 180);
        ctx.save();
        ctx.globalAlpha = pulse;
        ctx.fillStyle = col.coin;
        ctx.beginPath();
        ctx.moveTo(tipx, tipy);
        ctx.lineTo(cx + px * 7, cy + py * 7);
        ctx.lineTo(cx - px * 7, cy - py * 7);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
    drawChaseBoss();
    drawCutBoss();

    // 粒子（局部，不溢出棋盤）
    for (const p of particles){
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // 未生成段落以岩色漸層遮蔽
    const last = levels[levels.length - 1];
    const lastBottom = Math.max(last.a.y, ...last.segs.map(sg => Math.max(sg.a.y, sg.b.y)), ...last.holes.map(ho => ho.y + ho.r));
    const fy0 = (lastBottom + FOG_START - camY) * SC, fy1 = fy0 + FOG_H * SC;
    if (fy0 < H){
      const g = ctx.createLinearGradient(0, fy0, 0, fy1);
      const fm = depthM(lastBottom + FOG_START + FOG_H);
      g.addColorStop(0, rockRGBA(fm, 0));
      g.addColorStop(1, rockRGBA(fm, 1));
      ctx.fillStyle = g;
      ctx.fillRect(0, fy0, W, fy1 - fy0);
      ctx.fillStyle = rockColor(fm);
      if (fy1 < H) ctx.fillRect(0, fy1, W, H - fy1);
    }
    const sy0 = H * (1 - FOG_SCREEN);
    const sg = ctx.createLinearGradient(0, sy0, 0, H);
    const sm = depthM(camY + vh);
    sg.addColorStop(0, rockRGBA(sm, 0));
    sg.addColorStop(1, rockRGBA(sm, 1));
    ctx.fillStyle = sg;
    ctx.fillRect(0, sy0, W, H - sy0);

    // 幽暗／回聲層照明
    const lx = pose ? pose.x : coin.x, ly = pose ? pose.y : coin.y;
    const sx = (lx + WALL + LEVER_AREA) * SC, sy = (ly - camY) * SC;
    const ls = lightScale();
    const dark = Math.min(DARK_MAX, depthM(coin.y) / DARK_DEPTH * DARK_MAX);
    if (dark > 0.01){
      const g = ctx.createRadialGradient(sx, sy, LIGHT_IN * SC * ls, sx, sy, LIGHT_OUT * SC * ls);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,' + dark.toFixed(3) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // 中央橫幅（全畫面同時最多一條）
    if (banner.t < banner.dur && banner.text){
      const fadeIn = Math.min(1, banner.t / 0.2);
      const fadeOut = Math.min(1, Math.max(0, (banner.dur - banner.t) / 0.4));
      ctx.save();
      ctx.globalAlpha = Math.min(fadeIn, fadeOut);
      ctx.font = 'bold 26px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.65)'; ctx.shadowBlur = 8;
      ctx.fillStyle = col.fg;
      ctx.fillText(banner.text, W / 2, H * 0.24);
      ctx.restore();
    }

    // 金貨本體（含殘影、預覽弧、回聲殘影）
    if (state !== 'over' && !(pose && pose.sink)){
      ctx.save();
      ctx.scale(SC, SC);
      ctx.translate(WALL + LEVER_AREA, -camY);
      if (pose) drawCoin(pose.x, pose.y, pose.r);
      else {
        // M1 預測弧：淡虛線
        const preview = computePreview();
        if (preview.length >= 2){
          ctx.save();
          ctx.strokeStyle = rgbaOf(col.coin, PREVIEW_ALPHA);
          ctx.lineWidth = 1.6;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          preview.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
          ctx.stroke();
          ctx.restore();
        }
        // 回聲層殘影
        const lvHere = levels[here];
        if (lvHere && lvHere.event === 'echo'){
          for (let i = 0; i < Math.min(ECHO_GHOSTS, trail.length); i++){
            const p = trail[trail.length - 1 - i];
            ctx.globalAlpha = 0.18 * (1 - i / ECHO_GHOSTS);
            ctx.beginPath(); ctx.arc(p.x, p.y, COIN_R, 0, Math.PI * 2);
            ctx.strokeStyle = col['accent-crystal']; ctx.lineWidth = 1.4; ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
        drawTrail();
        // 蓄力回饋：26px 外圈細環（半徑 13）+ 2px 力道弧（不顯示數字）
        if (charging){
          const danger = power * 100 >= STRONG_FROM;
          ctx.save();
          ctx.lineWidth = 2;
          ctx.strokeStyle = rgbaOf(col['coin-line'], 0.5);
          ctx.beginPath(); ctx.arc(coin.x, coin.y, COIN_R + 1, 0, Math.PI * 2); ctx.stroke();
          ctx.strokeStyle = danger ? col['accent-danger'] : col.coin;
          ctx.beginPath();
          ctx.arc(coin.x, coin.y, COIN_R + 1, -Math.PI / 2, -Math.PI / 2 + power * Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
        drawCoin(coin.x, coin.y, COIN_R);
      }
      ctx.restore();
    }
  }

  // ================= 迴圈 =================
  let last = performance.now();
  function loop(now){
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    genBudget = GEN_TRIALS_PER_FRAME;  // R1：長跑每幀重置 trial 後備
    genDeadline = now + GEN_FRAME_MS;  // R1：本幀生成時間片 3ms，其餘段下幀續補
    ensureLevels(2);
    ensureLevels(LEVELS_AHEAD);
    update(dt);
    updateToast();
    draw();
    requestAnimationFrame(loop);
  }

      saveJSON(UPG_KEY, upgrades);

      <div>推進新段可賺金幣，競技場整場通過另有獎勵；可在選單「升級」花幣強化輔助線、金幣加成、開局力道、寶石上限、Boss 減速與照明。升級僅影響本局以上項目，不改變軌道物理。</div>
      <div class="panelRow"><span class="k">道具與二段蓄力</span></div>
      <div>數字鍵 1／2／3 使用護盾、鑽頭、磁石（自動模式不使用）；護盾擋一次落穴或追擊，鑽頭鑽破可破壞岩，磁石吸附半徑內寶石。空中可再按一次蓄力鍵補一次推力（每飛行一次、每局兩次）。</div>
      <div class="panelRow"><span class="k">被動槽</span></div>
      <div>跨局保留的輔助：彈簧靴每級提升手動發射初速 3%；油壺每 2 級增加一次二段蓄力；護甲片每級開局 +1 護盾。被動僅作用於手動發射與開局狀態，不影響軌道物理與自動試算。</div>
      <div class="panelRow"><span class="k">機關與金貨型態</span></div>
      <div>冰面減速更低、風場推進、緩衝墊接住墜落；移動平台、傳送門、旋槳為僅手動機關，自動模式降級為一般段。金貨型態在選單切換：標準／彈跳／滑順／重型。</div>
      <div class="panelRow"><span class="k">遺跡岔路</span></div>
      <div>每 8 層一岔：到岔點點擊左側（3 顆寶石）或右側（25 金幣＋隨機道具），選定後封閉另一側；自動模式預設走左。</div>
      <div class="panelRow"><span class="k">模式與委託</span></div>
      <div>Boss Rush 連戰連勝；限時衝刺在倒數歸零前盡量深入；殘局挑戰由種子重現。每日三項委託可領金幣，排行榜記錄最深、最速抵 B20 與 Rush 連勝。</div>
      <div class="panelRow"><span class="k">版本</span></div>
      <div>${VERSION_TAG}</div>
      <div class="menuList" style="margin-top:10px"><button id="replayTut" type="button">重看教學</button></div>`);
    $('replayTut').addEventListener('click', () => {
      closePanel();
      $('tutorial').classList.remove('hidden');
    });
  }

  // ================= 輸入 =================
  let activePointer = null;
  function releaseAll(){ activePointer = null; charging = false; chargeSource = null; power = 0; }

  function relicPending(){ const lv = levels[here]; return !!(lv && lv.relic && !lv.relic.branch); }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    ensureAudio();
    if (panelOpen() || state === 'over' || activePointer !== null) return;
    if (relicPending()){
      const rect = cv.getBoundingClientRect();
      chooseRelic((e.clientX - rect.left) < rect.width / 2 ? 'left' : 'right');
      return;
    }
    activePointer = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch(err) {}
    if (atLever(here)){ chargeSource = 'pointer'; startCharge(true); }
    else dashBoost();
  });
  const release = e => {
    if (e.pointerId !== activePointer) return;
    activePointer = null;
    if (chargeSource === 'pointer') flick();
  };
  document.addEventListener('pointerup', release);
  document.addEventListener('pointercancel', release);
  addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
  addEventListener('popstate', () => { if (panelOpen()) closePanel(); });

  const isGameKey = e => e.code === 'Space' || e.code === 'ArrowDown';
  addEventListener('keydown', e => {
    if (e.code === 'Escape'){ closePanel(); $('tutorial').classList.add('hidden'); return; }
    if (e.code === 'KeyM'){ openMenu(); return; }
    if (!panelOpen() && state === 'play' && relicPending() && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')){
      chooseRelic(e.code === 'ArrowLeft' ? 'left' : 'right'); return;
    }
    if (e.code === 'KeyR' && state === 'over'){ sfx.ui(); reset(); return; }
    // v4 道具快捷鍵 1/2/3
    if (!panelOpen() && state === 'play' && ['Digit1','Digit2','Digit3'].includes(e.code)){
      useItem({ Digit1: 'shield', Digit2: 'drill', Digit3: 'magnet' }[e.code]); return;
    }
    if (e.code === 'Tab' && panelOpen()){
      e.preventDefault();
      const f = [...document.querySelectorAll('#panel button, #panel [tabindex]:not([tabindex="-1"])')];
      if (!f.length) return;
      const idx = f.indexOf(document.activeElement);
      const next = e.shiftKey ? (idx <= 0 ? f.length - 1 : idx - 1) : (idx === f.length - 1 || idx < 0 ? 0 : idx + 1);
      f[next].focus();
      return;
    }
    if (panelOpen() || state === 'over' || !isGameKey(e)) return;
    e.preventDefault();
    ensureAudio();
    if (e.repeat) return;
    if (atLever(here)){ chargeSource = 'key'; startCharge(true); }
    else dashBoost();
  });
  addEventListener('keyup', e => {
    if (!isGameKey(e)) return;
    if (chargeSource === 'key') flick();
  });

  document.addEventListener('touchstart', e => { if (e.target === cv) e.preventDefault(); }, {passive:false});
  document.addEventListener('touchmove', e => { if (activePointer !== null) e.preventDefault(); }, {passive:false});
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('contextmenu', e => { if (e.target === cv) e.preventDefault(); });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    const onButton = e.target instanceof Element && e.target.closest('button');
    if (!onButton && now - lastTouchEnd < 350) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});

  // ================= 按鈕與分享 =================
  const autoBtn = $('autoBtn');
  $('retry').addEventListener('pointerdown', e => e.stopPropagation());
  $('retry').addEventListener('click', () => { sfx.ui(); reset(); });

  autoBtn.addEventListener('pointerdown', e => e.stopPropagation());
  autoBtn.addEventListener('click', () => {
    auto = !auto;
    autoRetryT = 0;
    if (!auto && charging) flick();
    autoBtn.textContent = auto ? '自動: ON' : '自動: OFF';
    autoBtn.classList.toggle('on', auto);
  });

  $('menuBtn').addEventListener('pointerdown', e => e.stopPropagation());
  $('menuBtn').addEventListener('click', openMenu);
  $('menuOpen').addEventListener('pointerdown', e => e.stopPropagation());
  $('menuOpen').addEventListener('click', openMenu);
  $('panelClose').addEventListener('click', closePanel);
  $('overlay').addEventListener('pointerdown', e => { if (e.target === $('overlay')) closePanel(); });

  $('tutorial').addEventListener('pointerdown', () => {
    $('tutorial').classList.add('hidden');
    tutorialDone = true;
    saveJSON('endlessShinkansen.tutorialDone', true);
  });

  function shareText(){
    return '地底レバー　抵達 ' + floorInfo(here).main + '！\n'
      + location.href.split(/[?#]/)[0] + '\n#地底レバー';
  }
  function resultImageFile(){
    const c = document.createElement('canvas');
    c.width = 800; c.height = 420;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, c.height);
    grad.addColorStop(0, col.rock1); grad.addColorStop(1, col.rock4);
    g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = col.fg; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = 'bold 40px ' + FONT;
    g.fillText('地底レバー', 400, 100);
    g.font = 'bold 84px ' + FONT;
    g.fillText(floorInfo(here).main, 400, 250);
    g.font = '16px ' + FONT;
    g.textAlign = 'left';
    g.fillText(VERSION_TAG, 24, 392);
    const bin = atob(c.toDataURL('image/png').split(',')[1]);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return new File([buf], 'result.png', { type: 'image/png' });
  }
  $('share').addEventListener('pointerdown', e => e.stopPropagation());
  $('share').addEventListener('click', () => {
    const btn = $('share');
    const text = shareText();
    const file = resultImageFile();
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ text, files: [file] }).catch(() => {});
      return;
    }
    if (navigator.share){
      navigator.share({ text }).catch(() => {});
      return;
    }
    navigator.clipboard?.writeText(text).then(() => {
      btn.textContent = '已複製';
      setTimeout(() => { btn.textContent = '分享'; }, 1500);
    }).catch(() => {});
  });

  // ================= 開始 =================
  resize();
  buildSideFrame();
  addEventListener('resize', resize);
  $('tutVer').textContent = VERSION_TAG;
  reset();
  if (!tutorialDone) $('tutorial').classList.remove('hidden');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
